[target.wasm32-unknown-emscripten]
# `cargo test --target wasm32-unknown-emscripten` runs the test programs
# (and the doctests) through tools/emscripten_run.py: under node, 22 or
# newer, as `node PROGRAM.js ARGS...`, or in headless Chromium with
# SDL3_EMSCRIPTEN_BROWSER=1 (and for the programs that ask for a browser,
# when there is one): see "Emscripten" in docs/HARDWARE_TESTING.md. (Cargo
# finds the script from here, as a path with a slash; it runs as an
# executable, through its `#!/usr/bin/env python3` line. Where that can't
# run, as on Windows, set CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER to
# `node`, or to `python` with the script's absolute path.)
runner = "tools/emscripten_run.py"
# The linker: emcc, through tools/emscripten_link.py, which adds the link
# options a program asks for in a custom section of its own (Cargo has no
# link options per test program: sdl3/tests/emscripten_asyncify.rs is
# linked with -sASYNCIFY=1 that way). The same as for the runner applies:
# where the script can't run, set CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_LINKER
# to `emcc` (`emcc.bat` on Windows; the programs that ask for options then
# don't get them).
linker = "tools/emscripten_link.py"
# Every link warns that -sWASM_BIGINT is deprecated (rustc passes it);
# silence emcc's deprecation warnings. The rest is what the test programs
# need: memory that grows past the 16 MB default, an 8 MB stack (the
# default is 64 KB), the exit code passed on, and node's environment
# variables seen by getenv() (SDL3_TEST_REQUIRE, SDL's hints), and WebGL 2
# (an OpenGL ES 3.0 context; without it emscripten makes WebGL 1 contexts
# only). The file system is emscripten's in-memory one (MEMFS), as in a
# browser.
rustflags = [
    "-Clink-arg=-Wno-deprecated",
    "-Clink-arg=-sALLOW_MEMORY_GROWTH=1",
    "-Clink-arg=-sMAXIMUM_MEMORY=4GB",
    "-Clink-arg=-sSTACK_SIZE=8MB",
    "-Clink-arg=-sEXIT_RUNTIME=1",
    "-Clink-arg=-sNODE_HOST_ENV=1",
    "-Clink-arg=-sMAX_WEBGL_VERSION=2",
]
# The same for the doctests, which rustdoc links.
rustdocflags = [
    "-Clink-arg=-Wno-deprecated",
    "-Clink-arg=-sALLOW_MEMORY_GROWTH=1",
    "-Clink-arg=-sMAXIMUM_MEMORY=4GB",
    "-Clink-arg=-sSTACK_SIZE=8MB",
    "-Clink-arg=-sEXIT_RUNTIME=1",
    "-Clink-arg=-sNODE_HOST_ENV=1",
    "-Clink-arg=-sMAX_WEBGL_VERSION=2",
]

# `cargo test --target aarch64-apple-ios-sim` (on a Mac with Xcode and an
# iOS Simulator runtime) runs the test programs and the doctests on a
# simulated iPhone through tools/ios_run.py: as processes of the simulated
# device (`xcrun simctl spawn`), or as apps for the programs that ask for
# it; the script picks, makes and boots the simulator. See "iOS Simulator"
# in docs/HARDWARE_TESTING.md. (The same for the x86-64 Simulator of Intel
# Macs; for the device target the script says it can't run a device's
# program.)
[target.aarch64-apple-ios-sim]
runner = "tools/ios_run.py"

[target.x86_64-apple-ios]
runner = "tools/ios_run.py"

[target.aarch64-apple-ios]
runner = "tools/ios_run.py"

# The same for tvOS: `cargo test --target aarch64-apple-tvos-sim` runs the
# programs on a simulated Apple TV (a tvOS Simulator runtime is needed).
# x86_64-apple-tvos is a tier 3 target, built with a nightly toolchain's
# `-Zbuild-std` (or a stable one's with RUSTC_BOOTSTRAP=1, as CI lints it).
[target.aarch64-apple-tvos-sim]
runner = "tools/ios_run.py"

[target.x86_64-apple-tvos]
runner = "tools/ios_run.py"

[target.aarch64-apple-tvos]
runner = "tools/ios_run.py"

# The same for visionOS: `cargo test --target aarch64-apple-visionos-sim`
# runs the programs on a simulated Apple Vision Pro (a visionOS Simulator
# runtime is needed).
[target.aarch64-apple-visionos-sim]
runner = "tools/ios_run.py"

[target.aarch64-apple-visionos]
runner = "tools/ios_run.py"
