[workspace]
resolver = "2"
members = ["sdl3", "sdl3-image", "sdl3-mixer", "sdl3-mixer-timidity", "sdl3-net", "sdl3-test", "sdl3-ttf"]

[workspace.package]
version = "3.5.0"
edition = "2021"
rust-version = "1.87"
license = "Zlib"
repository = "https://github.com/danielpclark/SDL"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
