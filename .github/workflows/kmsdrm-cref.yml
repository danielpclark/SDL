# Throwaway diag workflow (claude/diag-kmsdrm-vulkan* only, never merged):
# upstream's C SDL at ea7a2da (KMS/DRM, shared libdrm/libgbm, Vulkan)
# and this translation running the kmsdrm_* programs as root on tty3, on a
# vkms card, on the same runner, RUNS times each; their traces compared.
# The C twins are diag/kmsdrm/*.c (on the diag branch only).
name: kmsdrm-cref

on:
  push:
    branches: ['claude/diag-kmsdrm-vulkan*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUNS: 10
  PROGRAMS: kmsdrm_video kmsdrm_gles kmsdrm_cursor kmsdrm_input kmsdrm_vulkan
  SDL3_CONSOLE_TIMEOUT: 240
  SDL_KMSDRM_DEVICE_INDEX: 0

jobs:
  cref:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          key: kmsdrm-cref
      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libdrm-dev libgbm-dev libegl-dev libgles-dev libgl-dev libudev-dev \
            ninja-build libdrm2 libgbm1 libegl1 libegl-mesa0 libgl1 libgles2 libgl1-mesa-dri \
            libvulkan-dev libvulkan1 mesa-vulkan-drivers > /dev/null
      - name: Load vkms, enable uinput
        shell: bash
        run: |
          sudo modprobe vkms enable_cursor=1 enable_overlay=1
          for i in $(seq 1 100); do [ -e /dev/dri/card0 ] && break; sleep 0.1; done
          ls -l /dev/dri
          readlink -f /sys/class/drm/card0/device /sys/class/drm/card1/device || true
          grep -H . /sys/class/drm/card*-*/status || true
          sudo ls /sys/kernel/debug/dri/0 | head -30 || true
          printf '%s\n' 'KERNEL=="uinput", SUBSYSTEM=="misc", MODE="0666", OPTIONS+="static_node=uinput"' \
            'SUBSYSTEM=="input", KERNEL=="event*|js*", ATTRS{name}=="SDL*", MODE="0666"' | sudo tee /etc/udev/rules.d/99-sdl3-uinput.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=uinput
          sudo udevadm settle
          mkdir -p "$RUNNER_TEMP/out"
          { uname -a; cat /proc/cmdline; ls /sys/class/graphics; cat /proc/fb; dpkg-query -W libgbm1 libdrm2 libegl-mesa0; } > "$RUNNER_TEMP/out/probe.txt" 2>&1 || true
      - name: Build upstream and the C twins
        run: |
          git clone -q --filter=blob:none https://github.com/libsdl-org/SDL "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout -q ea7a2da
          git -C "$RUNNER_TEMP/upstream" log --oneline -1
          if [ -d diag/kmsdrm/patches ]; then for f in diag/kmsdrm/patches/*.py; do python3 "$f" "$RUNNER_TEMP/upstream"; done; fi
          git -C "$RUNNER_TEMP/upstream" diff --stat
          cmake -S "$RUNNER_TEMP/upstream" -B "$RUNNER_TEMP/build" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_KMSDRM=ON -DSDL_KMSDRM_SHARED=ON -DSDL_VULKAN=ON \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF > "$RUNNER_TEMP/cmake.log" 2>&1 || { tail -80 "$RUNNER_TEMP/cmake.log"; exit 1; }
          grep -i 'kmsdrm\|egl\|opengl' "$RUNNER_TEMP/cmake.log" | head -20 || true
          cmake --build "$RUNNER_TEMP/build" > "$RUNNER_TEMP/build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          for p in $PROGRAMS; do
            gcc -g -Wall -o "$RUNNER_TEMP/${p}_c" "diag/kmsdrm/$p.c" -Idiag/kmsdrm -I"$RUNNER_TEMP/upstream/include" -L"$RUNNER_TEMP/build" -lSDL3
          done
      - name: Vulkan probe (system Mesa)
        shell: bash
        run: |
          set +e
          gcc -g -Wall -o "$RUNNER_TEMP/vkprobe" diag/kmsdrm/vkprobe.c $(pkg-config --cflags libdrm) -lvulkan -ldrm
          ls /usr/share/vulkan/icd.d/ > "$RUNNER_TEMP/out/vkprobe.txt"
          dpkg-query -W mesa-vulkan-drivers libvulkan1 >> "$RUNNER_TEMP/out/vkprobe.txt"
          sudo "$RUNNER_TEMP/vkprobe" /dev/dri/card0 >> "$RUNNER_TEMP/out/vkprobe.txt" 2>&1
          echo "status $?" >> "$RUNNER_TEMP/out/vkprobe.txt"
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json sudo -E "$RUNNER_TEMP/vkprobe" /dev/dri/card0 >> "$RUNNER_TEMP/out/vkprobe.txt" 2>&1
          exit 0
      - name: Build the Rust programs
        shell: bash
        run: |
          args=""; for p in $PROGRAMS; do args="$args --test $p"; done
          cargo test -p sdl3 $args --no-run --message-format=json > "$RUNNER_TEMP/build.json"
          for p in $PROGRAMS; do
            python3 -c 'import json,sys; [print(m["executable"]) for m in map(json.loads, open(sys.argv[1])) if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] == sys.argv[2]]' "$RUNNER_TEMP/build.json" "$p" > "$RUNNER_TEMP/${p}_rust"
          done
      - name: Run C and Rust
        shell: bash
        run: |
          set +e
          O="$RUNNER_TEMP/out"
          for i in $(seq 1 "$RUNS"); do
            for p in $PROGRAMS; do
              timeout 400 sudo env SDL3_CONSOLE_TIMEOUT="$SDL3_CONSOLE_TIMEOUT" SDL_KMSDRM_DEVICE_INDEX=0 SDL_VIDEO_DRIVER=kmsdrm \
                LD_LIBRARY_PATH="$RUNNER_TEMP/build" python3 tools/linux_console_run.py --vt 3 "$RUNNER_TEMP/${p}_c" > "$O/$p.c$i.log" 2> "$O/$p.c$i.err"
              echo "$p c$i status $?"
              grep -a '^trace: ' "$O/$p.c$i.log" > "$O/$p.c$i.txt"
              timeout 400 sudo env SDL3_CONSOLE_TIMEOUT="$SDL3_CONSOLE_TIMEOUT" SDL_KMSDRM_DEVICE_INDEX=0 \
                SDL3_TEST_REQUIRE=kmsdrm,vt,uinput,egl RUST_BACKTRACE=1 "$(cat "$RUNNER_TEMP/${p}_rust")" > "$O/$p.r$i.log" 2> "$O/$p.r$i.err"
              echo "$p r$i status $?"
              grep -a '^trace: ' "$O/$p.r$i.log" > "$O/$p.r$i.txt"
            done
          done
          md5sum "$O"/*.txt
          exit 0
      - name: Findings (last)
        if: always()
        shell: bash
        run: |
          set +e
          O="$RUNNER_TEMP/out"
          cat "$O/probe.txt"
          echo "=================== vkprobe"; cat "$O/vkprobe.txt"
          for p in $PROGRAMS; do
            echo "=================== $p"
            echo "== C stderr (1)"; grep -av 'MESA-LOADER' "$O/$p.c1.err" | head -30
            echo "== Rust stderr (1)"; grep -av 'MESA-LOADER' "$O/$p.r1.err" | head -30
            echo "== C runs differing from c1:"; for i in $(seq 2 "$RUNS"); do cmp -s "$O/$p.c1.txt" "$O/$p.c$i.txt" || { echo "c$i"; diff "$O/$p.c1.txt" "$O/$p.c$i.txt" | head -20; }; done
            echo "== Rust runs differing from r1:"; for i in $(seq 2 "$RUNS"); do cmp -s "$O/$p.r1.txt" "$O/$p.r$i.txt" || { echo "r$i"; diff "$O/$p.r1.txt" "$O/$p.r$i.txt" | head -20; }; done
            echo "== the Rust program's verdict"; grep -a "^$p: \|^rust: " "$O/$p.r1.log" | head -20; grep -ac "the trace is upstream's" "$O"/$p.r*.log
            echo "== diff c1 r1 (without the preamble)"; diff -a <(tail -n +2 "$O/$p.c1.txt") <(tail -n +2 "$O/$p.r1.txt") | head -80 && echo "(the same)"
          done
          for p in $PROGRAMS; do
            echo "=================== C trace of $p"
            sed 's/^trace: /|/' "$O/$p.c1.txt"
          done

  # A newer Mesa's lavapipe (kisak-mesa PPA): does it enumerate vkms's
  # displays?
  vkprobe-newer-mesa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        shell: bash
        run: |
          set +e
          sudo add-apt-repository -y ppa:kisak/kisak-mesa > /dev/null 2>&1
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q libdrm-dev libvulkan-dev libvulkan1 mesa-vulkan-drivers > /dev/null 2>&1
          dpkg-query -W mesa-vulkan-drivers libvulkan1
          sudo modprobe vkms enable_cursor=1 enable_overlay=1
          for i in $(seq 1 100); do [ -e /dev/dri/card0 ] && break; sleep 0.1; done
          gcc -g -Wall -o vkprobe diag/kmsdrm/vkprobe.c $(pkg-config --cflags libdrm) -lvulkan -ldrm
          sudo ./vkprobe /dev/dri/card0
          echo "status $?"
          exit 0

  # vkms's configfs devices: two pipelines on one card (for PR 5's
  # multi-display program)
  configfs-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        shell: bash
        run: |
          set +e
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q libdrm-dev libdrm-tests > /dev/null 2>&1
          gcc -g -Wall -o drmlist diag/kmsdrm/drmlist.c $(pkg-config --cflags --libs libdrm)
          sudo modprobe vkms enable_cursor=1 enable_overlay=1
          for i in $(seq 1 100); do [ -e /dev/dri/card0 ] && break; sleep 0.1; done
          mountpoint -q /sys/kernel/config || sudo mount -t configfs none /sys/kernel/config
          V=/sys/kernel/config/vkms/multi
          sudo mkdir "$V"
          sudo find "$V" | sort
          for i in 0 1; do
            sudo mkdir "$V/planes/plane$i" "$V/crtcs/crtc$i" "$V/encoders/encoder$i" "$V/connectors/connector$i"
            echo 1 | sudo tee "$V/planes/plane$i/type" > /dev/null
            sudo ln -s "$V/crtcs/crtc$i" "$V/planes/plane$i/possible_crtcs"
            sudo ln -s "$V/crtcs/crtc$i" "$V/encoders/encoder$i/possible_crtcs"
            sudo ln -s "$V/encoders/encoder$i" "$V/connectors/connector$i/possible_encoders"
          done
          for f in $(sudo find "$V" -type f | sort); do echo "$f = $(sudo cat "$f")"; done
          sudo find "$V" -type l -printf '%p -> %l\n' | sort
          echo 1 | sudo tee "$V/enabled"; echo "enable: $?"
          sleep 1
          sudo dmesg | tail -8
          ls -l /dev/dri /sys/class/drm
          grep -H . /sys/class/drm/card*-*/status
          for c in /dev/dri/card*; do sudo ./drmlist "$c"; done
          echo "== modetest -D /dev/dri/card2 (the PR 0 probe's command)"
          sudo modetest -D /dev/dri/card2 -c 2>&1 | head -5
          echo "== modetest -M vkms"
          sudo modetest -M vkms -c 2>&1 | grep -a connected
          sudo ls /sys/kernel/debug/dri/
          for n in /sys/kernel/debug/dri/*/name; do echo "$n: $(sudo cat "$n")"; done
          sudo ls /sys/kernel/debug/dri/2/ 2>&1 | head -20
          echo "== a cursor plane and an overlay too, a second device"
          W=/sys/kernel/config/vkms/multi2
          sudo mkdir "$W"
          for i in 0 1; do
            sudo mkdir "$W/crtcs/crtc$i" "$W/encoders/encoder$i" "$W/connectors/connector$i"
            for t in 1 2; do
              sudo mkdir "$W/planes/plane$i$t"
              echo $t | sudo tee "$W/planes/plane$i$t/type" > /dev/null
              sudo ln -s "$W/crtcs/crtc$i" "$W/planes/plane$i$t/possible_crtcs"
            done
            sudo ln -s "$W/crtcs/crtc$i" "$W/encoders/encoder$i/possible_crtcs"
            sudo ln -s "$W/encoders/encoder$i" "$W/connectors/connector$i/possible_encoders"
          done
          echo 2 | sudo tee "$W/connectors/connector1/status"
          echo 1 | sudo tee "$W/enabled"; echo "enable: $?"
          sleep 1
          ls -l /dev/dri
          grep -H . /sys/class/drm/card*-*/status
          for c in /dev/dri/card*; do sudo ./drmlist "$c"; done
          echo "== disable and remove"
          echo 0 | sudo tee "$V/enabled" "$W/enabled"
          ls -l /dev/dri
          exit 0
