name: diag-b7

on:
  push:
    branches: [claude/diag-b7]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_TEST_NOCAPTURE: 1
  MESA_VERSION: "26.2.4"
  MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
  VULKAN_LOADER_TAG: vulkan-sdk-1.4.363.0
  VULKAN_LOADER_COMMIT: fa218055ff4948b159f31d43f800c808a13d51df

jobs:
  d3d:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          key: pinned
      - name: Cache the GPU drivers
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/gpu-cache
          key: gpu-${{ runner.os }}-mesa-${{ env.MESA_VERSION }}-loader-${{ env.VULKAN_LOADER_COMMIT }}
      - name: Install the GPU drivers (Windows)
        shell: bash
        run: |
          C="$RUNNER_TEMP/gpu-cache"
          G="$RUNNER_TEMP/gpu"
          mkdir -p "$C" "$G"
          cd "$C"
          if [ ! -f mesa.7z ]; then
            curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z"
          fi
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -y -o"$G" mesa.7z x64 > /dev/null
          if [ ! -f vulkan-1.dll ]; then
            git clone -q --depth 1 --branch "$VULKAN_LOADER_TAG" https://github.com/KhronosGroup/Vulkan-Loader "$G/loader"
            test "$(git -C "$G/loader" rev-parse HEAD)" = "$VULKAN_LOADER_COMMIT"
            cmake -S "$G/loader" -B "$G/loader/build" -D UPDATE_DEPS=ON -D CMAKE_BUILD_TYPE=Release > "$G/cmake.log" 2>&1 || { tail -50 "$G/cmake.log"; exit 1; }
            cmake --build "$G/loader/build" --config Release --parallel > "$G/build.log" 2>&1 || { tail -80 "$G/build.log"; exit 1; }
            cp "$G/loader/build/loader/Release/vulkan-1.dll" .
          fi
          cd "$GITHUB_WORKSPACE"
          d=target/debug/deps
          mkdir -p "$d"
          cp "$G"/x64/{opengl32,libgallium_wgl,libEGL,libGLESv2}.dll "$C/vulkan-1.dll" "$d/"
          MSYS_NO_PATHCONV=1 reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath -w "$G/x64/lvp_icd.x86_64.json")" /t REG_DWORD /d 0 /f
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "EGL_PLATFORM=windows" >> "$GITHUB_ENV"
      - name: Build the sdl3 test binary
        shell: bash
        run: |
          cargo test -p sdl3 --lib --no-run 2>&1 | tee build.log
          exe=$(sed -n 's/.*Executable.*unittests src.lib.rs (\(.*\))/\1/p' build.log | tail -1)
          exe=$(cygpath -w "$PWD/$exe")
          echo "TEST_EXE=$exe" >> "$GITHUB_ENV"
          echo "test exe: $exe"
      - name: The device-loss palette test under cdb
        continue-on-error: true
        shell: bash
        run: |
          "C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" -lines \
            -c 'sxe -c ".echo AV-STACK; r; .lines -e; kpn 60; q" av; g' \
            "$TEST_EXE" render::direct3d11::tests::d3d11_palettes_survive_a_device_loss --exact --test-threads=1
      - name: The Direct3D render tests, one at a time
        run: cargo test -p sdl3 --lib render::direct3d -- --test-threads=1
      - name: The Vulkan render tests, one at a time
        run: cargo test -p sdl3 --lib render::vulkan -- --test-threads=1
