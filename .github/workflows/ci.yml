name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The pinned toolchain the lints, docs and main tests run on, so a new Rust
# release (and its new lints) can't turn CI red on its own. Bump it on
# purpose, fixing what the new clippy finds in the same change.
env:
  RUST_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # sdl3-mixer's zlib-only build (no `timidity` feature)
      - run: cargo clippy -p sdl3-mixer --all-targets --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # the pinned toolchain, and the minimum supported version
        # (rust-version in Cargo.toml)
        toolchain: [pinned, "1.87"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Print a failing test's panic as it happens rather than in the summary
      # at the end, so a run that then hangs still shows what went wrong.
      RUST_TEST_NOCAPTURE: 1
      # The test capabilities (test_support::CAPABILITIES in sdl3/src/lib.rs)
      # the packages installed below provide on ubuntu: tests that would
      # skip without them fail instead. Not uinput (the runner can't use
      # /dev/uinput); the Windows jobs require nothing, since what a hosted
      # runner offers (an audio endpoint, a usable desktop) isn't pinned down.
      LINUX_REQUIRE: x11,xvfb,glx,egl,vulkan,wayland,dbus,pulseaudio,pipewire,alsa,udev,hidapi
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain == 'pinned' && env.RUST_TOOLCHAIN || matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      # What the Linux tests that would otherwise skip need (see
      # docs/HARDWARE_TESTING.md): an X server, Mesa's software GL, EGL and
      # Vulkan, a headless Wayland compositor, the PulseAudio binary, and a
      # PipeWire server with WirePlumber and null devices.
      - name: Install the test environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libegl1 libgles2 \
            mesa-vulkan-drivers libvulkan1 libxtst6 libwayland-client0 \
            libwayland-egl1 libwayland-cursor0 libxkbcommon0 sway \
            pulseaudio pulseaudio-utils pipewire pipewire-bin wireplumber \
            libudev1 libasound2t64 libdbus-1-3 dbus-daemon
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" tools/ci/start-pipewire.sh
      - run: cargo test --workspace
        env:
          # Skips are listed in the job summary; on Linux the capabilities
          # installed above are required, so a test that can't find one
          # fails instead of skipping.
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
          SDL3_TEST_REQUIRE: ${{ runner.os == 'Linux' && env.LINUX_REQUIRE || '' }}
      # sdl3-mixer without its default `timidity` feature: the zlib-only
      # build, without sdl3-mixer-timidity.
      - name: cargo test -p sdl3-mixer --no-default-features
        run: cargo test -p sdl3-mixer --no-default-features
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
          SDL3_TEST_REQUIRE: ${{ runner.os == 'Linux' && env.LINUX_REQUIRE || '' }}
      - name: cargo test --release
        if: matrix.toolchain == 'pinned'
        run: cargo test --workspace --release
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
          SDL3_TEST_REQUIRE: ${{ runner.os == 'Linux' && env.LINUX_REQUIRE || '' }}
      - name: List the skipped checks
        if: always()
        shell: bash
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
        run: |
          if [ -s "$SDL3_TEST_SKIP_LOG" ]; then
            {
              echo "### Skipped checks (${{ matrix.os }}, ${{ matrix.toolchain }})"
              echo
              echo "| capability | test | reason |"
              echo "|---|---|---|"
              sort -u "$SDL3_TEST_SKIP_LOG" | sed 's/|/\\|/g; s/\t/ | /g; s/^/| /; s/$/ |/'
            } >> "$GITHUB_STEP_SUMMARY"
            cut -f1 "$SDL3_TEST_SKIP_LOG" | sort | uniq -c
          else
            echo "no checks skipped"
          fi

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
