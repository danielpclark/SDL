name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios_only:
        description: Run only the iOS Simulator job
        type: boolean
        default: false
      ios_test_args:
        description: "The iOS Simulator job's cargo test arguments in place of --workspace (e.g. -p sdl3 --lib -- video::)"
        type: string
        default: ""
      tvos_only:
        description: Run only the tvOS Simulator job
        type: boolean
        default: false
      tvos_test_args:
        description: "The tvOS Simulator job's cargo test arguments in place of --workspace (e.g. -p sdl3 --test uikit_tvos_input)"
        type: string
        default: ""
      visionos_only:
        description: Run only the visionOS Simulator job
        type: boolean
        default: false
      visionos_test_args:
        description: "The visionOS Simulator job's cargo test arguments in place of its own (e.g. -p sdl3 --test uikit_visionos)"
        type: string
        default: ""
      android_only:
        description: Run only the Android emulator job
        type: boolean
        default: false
      android_test_args:
        description: "The Android emulator job's cargo test arguments in place of --workspace (e.g. -p sdl3 --lib -- video::)"
        type: string
        default: ""
      android_cref:
        description: "(diag) the C references of the android tests: NAME.c programs and headers, .tar.gz then base64"
        type: string
        default: ""
      android_probe:
        description: "(diag) the boot probe"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The pinned toolchain the lints, docs and main tests run on, so a new Rust
# release (and its new lints) can't turn CI red on its own. Bump it on
# purpose, fixing what the new clippy finds in the same change.
env:
  RUST_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # MoltenVK's release, pinned, for the macOS job (its MoltenVK-macos.tar)
  # and the Simulator jobs (its MoltenVK-all.tar, the only archive of the
  # release with the Simulators' frameworks)
  MOLTENVK_VERSION: v1.4.2
  MOLTENVK_ALL_SHA256: 562a15a29bc358446a56a4091c5f7e08f604184187c1d34f712148b61ef17276

jobs:
  fmt:
    name: rustfmt
    if: ${{ !inputs.ios_only && !inputs.tvos_only && !inputs.visionos_only && !inputs.android_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    if: ${{ !inputs.ios_only && !inputs.tvos_only && !inputs.visionos_only && !inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # Intel Macs: the x86-64 build is linted on the Apple Silicon
          # runner; Emscripten, iOS, tvOS and visionOS (the devices, the
          # arm64 Simulators and the x86-64 ones) and Android (its four
          # ABIs) on the Linux one (no emcc, SDK or NDK is needed to lint;
          # rust-src builds the standard library of x86_64-apple-tvos, a
          # tier 3 target)
          components: ${{ matrix.os == 'ubuntu-latest' && 'clippy,rust-src' || 'clippy' }}
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin' || matrix.os == 'ubuntu-latest' && 'wasm32-unknown-emscripten,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-tvos,aarch64-apple-tvos-sim,aarch64-apple-visionos,aarch64-apple-visionos-sim,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: matrix.os == 'macos-latest'
        run: cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target wasm32-unknown-emscripten -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target aarch64-apple-ios -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target x86_64-apple-ios -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target aarch64-apple-tvos -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target aarch64-apple-tvos-sim -- -D warnings
      # (the x86-64 tvOS Simulator is a tier 3 target: its standard library
      # is built from rust-src, which takes the pinned toolchain's unstable
      # -Zbuild-std; RUSTC_BOOTSTRAP allows it on a stable release)
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -Zbuild-std --workspace --all-targets --target x86_64-apple-tvos -- -D warnings
        env:
          RUSTC_BOOTSTRAP: 1
      # (visionOS: the device and the arm64 Simulator, tier 2 targets; there
      # is no x86-64 visionOS Simulator)
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target aarch64-apple-visionos -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target aarch64-apple-visionos-sim -- -D warnings
      # (Android: the 64-bit and the 32-bit ARM and x86 ABIs, all tier 2
      # targets)
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target aarch64-linux-android -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target armv7-linux-androideabi -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target x86_64-linux-android -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --target i686-linux-android -- -D warnings
      # sdl3-mixer's zlib-only build (no `timidity`, `fluidsynth`, `mpg123` or
      # `gme` feature)
      - run: cargo clippy -p sdl3-mixer --all-targets --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    if: ${{ !inputs.ios_only && !inputs.tvos_only && !inputs.visionos_only && !inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # the pinned toolchain, and the minimum supported version
        # (rust-version in Cargo.toml)
        toolchain: [pinned, "1.87"]
    runs-on: ${{ matrix.os }}
    # The pinned Windows job (debug, the zlib-only mixer, then release) takes
    # close to 30 minutes; this still stops a hung run.
    timeout-minutes: 45
    env:
      # Print a failing test's panic as it happens rather than in the summary
      # at the end, so a run that then hangs still shows what went wrong.
      RUST_TEST_NOCAPTURE: 1
      # The test capabilities (test_support::CAPABILITIES in sdl3/src/lib.rs)
      # the packages and GPU drivers installed below provide: tests that
      # would skip without them fail instead. Not uinput on ubuntu (the
      # runner can't use /dev/uinput), nor what a hosted runner doesn't pin
      # down (an audio endpoint, GameInput, a camera). Not vulkan and egl on
      # Windows and macOS either, which a few checks skip by design there:
      # "Check the GPU skips" below fails on any other skip of them.
      LINUX_REQUIRE: x11,xvfb,glx,egl,vulkan,wayland,dbus,pulseaudio,pipewire,alsa,udev,hidapi,tzdata,locales,android-sdk
      # The Android SDK's build-tools whose dexdump checks the DEX file
      # (android-sdk, with the NDK's jni.h: the runner image has both)
      SDL3_ANDROID_BUILD_TOOLS: "35.0.0"
      WINDOWS_REQUIRE: wgl
      # The GPU drivers of the Windows and macOS jobs, pinned: Mesa for
      # Windows (pal1000/mesa-dist-win's MSVC build: llvmpipe OpenGL and
      # EGL, lavapipe Vulkan) with the Khronos Vulkan loader built from its
      # SDK tag (Windows has none), and MoltenVK's release build
      # (MOLTENVK_VERSION, above).
      MESA_VERSION: "26.2.4"
      MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
      VULKAN_LOADER_TAG: vulkan-sdk-1.4.363.0
      VULKAN_LOADER_COMMIT: fa218055ff4948b159f31d43f800c808a13d51df
      MOLTENVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain == 'pinned' && env.RUST_TOOLCHAIN || matrix.toolchain }}
          # Emscripten, iOS and Android (64-bit and 32-bit ARM) build with
          # the minimum supported version too (no emcc, SDK or NDK is needed
          # to check)
          targets: ${{ matrix.toolchain == '1.87' && matrix.os == 'ubuntu-latest' && 'wasm32-unknown-emscripten,aarch64-apple-ios,aarch64-linux-android,armv7-linux-androideabi' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - if: matrix.toolchain == '1.87' && matrix.os == 'ubuntu-latest'
        run: cargo check --target wasm32-unknown-emscripten
      - if: matrix.toolchain == '1.87' && matrix.os == 'ubuntu-latest'
        run: cargo check --target aarch64-apple-ios
      - if: matrix.toolchain == '1.87' && matrix.os == 'ubuntu-latest'
        run: cargo check --target aarch64-linux-android
      - if: matrix.toolchain == '1.87' && matrix.os == 'ubuntu-latest'
        run: cargo check --target armv7-linux-androideabi
      # What the Linux tests that would otherwise skip need (see
      # docs/HARDWARE_TESTING.md): an X server, Mesa's software GL, EGL and
      # Vulkan, a headless Wayland compositor, the PulseAudio binary, and a
      # PipeWire server with WirePlumber and null devices.
      - name: Install the test environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libegl1 libgles2 \
            mesa-vulkan-drivers libvulkan1 libxtst6 libwayland-client0 \
            libwayland-egl1 libwayland-cursor0 libxkbcommon0 sway \
            pulseaudio pulseaudio-utils pipewire pipewire-bin wireplumber \
            libudev1 libasound2t64 libdbus-1-3 dbus-daemon tzdata locales
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" tools/ci/start-pipewire.sh
      # The GPU driver archives and the Vulkan loader build, kept between
      # runs (the archives are checked again on every run).
      - name: Cache the GPU drivers
        if: runner.os != 'Linux'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/gpu-cache
          key: gpu-${{ runner.os }}-${{ runner.os == 'Windows' && format('mesa-{0}-loader-{1}', env.MESA_VERSION, env.VULKAN_LOADER_COMMIT) || format('moltenvk-{0}', env.MOLTENVK_VERSION) }}
      # Mesa's opengl32.dll next to the test executables, where it's found
      # before System32's (Mesa's per-application deployment), with its
      # libgallium_wgl.dll, libEGL.dll and libGLESv2.dll and the Vulkan
      # loader; lavapipe's ICD in the registry (the loader ignores
      # VK_DRIVER_FILES in an elevated process, as the runner's). And two
      # Mesa settings: llvmpipe (on the runner's Microsoft Basic Render
      # Driver Mesa picks its d3d12 driver, whose glReadPixels ends the
      # process), and EGL's Windows platform for the default display, which
      # SDL's EGL window surfaces need (this build's default is surfaceless).
      - name: Install the GPU drivers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          C="$RUNNER_TEMP/gpu-cache"
          G="$RUNNER_TEMP/gpu"
          mkdir -p "$C" "$G"
          cd "$C"
          if [ ! -f mesa.7z ]; then
            curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z"
          fi
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -y -o"$G" mesa.7z x64 > /dev/null
          if [ ! -f vulkan-1.dll ]; then
            git clone -q --depth 1 --branch "$VULKAN_LOADER_TAG" https://github.com/KhronosGroup/Vulkan-Loader "$G/loader"
            test "$(git -C "$G/loader" rev-parse HEAD)" = "$VULKAN_LOADER_COMMIT"
            cmake -S "$G/loader" -B "$G/loader/build" -D UPDATE_DEPS=ON -D CMAKE_BUILD_TYPE=Release > "$G/cmake.log" 2>&1 || { tail -50 "$G/cmake.log"; exit 1; }
            cmake --build "$G/loader/build" --config Release --parallel > "$G/build.log" 2>&1 || { tail -80 "$G/build.log"; exit 1; }
            cp "$G/loader/build/loader/Release/vulkan-1.dll" .
          fi
          cd "$GITHUB_WORKSPACE"
          for d in target/debug/deps target/release/deps; do
            mkdir -p "$d"
            cp "$G"/x64/{opengl32,libgallium_wgl,libEGL,libGLESv2}.dll "$C/vulkan-1.dll" "$d/"
          done
          MSYS_NO_PATHCONV=1 reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath -w "$G/x64/lvp_icd.x86_64.json")" /t REG_DWORD /d 0 /f
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "EGL_PLATFORM=windows" >> "$GITHUB_ENV"
      # MoltenVK's dylib in /usr/local/lib, where upstream's default
      # libMoltenVK.dylib is found, without a loader: through one, MoltenVK's
      # devices need portability enumeration, which upstream's Vulkan
      # renderer doesn't ask for.
      - name: Install the GPU drivers (macOS)
        if: runner.os == 'macOS'
        run: |
          C="$RUNNER_TEMP/gpu-cache"
          mkdir -p "$C"
          cd "$C"
          if [ ! -f moltenvk.tar ]; then
            curl -fsSL -o moltenvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar"
          fi
          echo "$MOLTENVK_SHA256  moltenvk.tar" | shasum -a 256 -c
          tar xf moltenvk.tar -C "$RUNNER_TEMP" MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
          sudo mkdir -p /usr/local/lib
          sudo cp "$RUNNER_TEMP/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib" /usr/local/lib/
      - run: cargo test --workspace
        env:
          # Skips are listed in the job summary; the capabilities installed
          # above are required, so a test that can't find one fails instead
          # of skipping.
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
          SDL3_TEST_REQUIRE: ${{ runner.os == 'Linux' && env.LINUX_REQUIRE || runner.os == 'Windows' && env.WINDOWS_REQUIRE || '' }}
      # sdl3-mixer without its default `timidity`, `fluidsynth`, `mpg123` and
      # `gme` features: the zlib-only build, without sdl3-mixer-timidity,
      # sdl3-mixer-fluidsynth, sdl3-mixer-mpg123 and sdl3-mixer-gme.
      - name: cargo test -p sdl3-mixer --no-default-features
        run: cargo test -p sdl3-mixer --no-default-features
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
          SDL3_TEST_REQUIRE: ${{ runner.os == 'Linux' && env.LINUX_REQUIRE || runner.os == 'Windows' && env.WINDOWS_REQUIRE || '' }}
      - name: cargo test --release
        if: matrix.toolchain == 'pinned'
        run: cargo test --workspace --release
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
          SDL3_TEST_REQUIRE: ${{ runner.os == 'Linux' && env.LINUX_REQUIRE || runner.os == 'Windows' && env.WINDOWS_REQUIRE || '' }}
      # The render-state test whose checks MoltenVK misdraws under the Metal
      # debug layer (which the Metal tests turn on in the main run's
      # process, so they skip there), without the layer: they must run.
      - name: cargo test the MoltenVK render states without the Metal debug layer
        if: runner.os == 'macOS'
        run: cargo test -p sdl3 --lib render::gpu::tests::gpu_render_states -- --exact
        env:
          MTL_DEBUG_LAYER: 0
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips-moltenvk.tsv
          SDL3_TEST_REQUIRE: vulkan
      - name: List the skipped checks
        if: always()
        shell: bash
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
        run: tools/ci/list-skips.sh "$SDL3_TEST_SKIP_LOG" "${{ matrix.os }}, ${{ matrix.toolchain }}"
      # The skips of vulkan and egl by design: on Windows, lavapipe has no
      # VK_EXT_headless_surface (the offscreen driver's Vulkan check); on
      # macOS, MoltenVK misdraws render-state checks under the Metal debug
      # layer (run again without it above); on both, the offscreen
      # driver has no EGL (the OpenGL and OpenGL ES 2 renderers' checks on
      # it). Any other skip of them fails the job.
      - name: Check the GPU skips
        if: runner.os != 'Linux'
        shell: bash
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
        run: |
          touch "$SDL3_TEST_SKIP_LOG"
          awk -F '\t' -v os="$RUNNER_OS" '
            $1 == "vulkan" && os == "Windows" && $2 == "video::drivers::offscreen::vulkan::tests::offscreen_vulkan_surfaces" && $3 == "no VK_EXT_headless_surface" { next }
            $1 == "vulkan" && os == "macOS" && $2 == "render::gpu::tests::gpu_render_states" && $3 ~ /^MoltenVK misdraws .* \(MTL_DEBUG_LAYER\)$/ { next }
            $1 == "egl" && $2 ~ /^render::opengl(es2)?::tests::/ && $3 ~ /offscreen/ { next }
            $1 == "vulkan" || $1 == "egl"' "$SDL3_TEST_SKIP_LOG" > "$RUNNER_TEMP/unexpected.tsv"
          if [ -f "$RUNNER_TEMP/skips-moltenvk.tsv" ]; then
            cat "$RUNNER_TEMP/skips-moltenvk.tsv" >> "$RUNNER_TEMP/unexpected.tsv"
          fi
          if [ -s "$RUNNER_TEMP/unexpected.tsv" ]; then
            cat "$RUNNER_TEMP/unexpected.tsv"
            echo "::error::vulkan or egl checks skipped (above)"
            exit 1
          fi

  # The test programs built for Emscripten, run under node and in headless
  # Chrome (tools/emscripten_run.py, the runner in .cargo/config.toml): see
  # "Emscripten" in docs/HARDWARE_TESTING.md. (Linted on the Linux clippy
  # runner, checked with 1.87 in the test job.)
  emscripten:
    name: test (wasm32-unknown-emscripten, node and Chrome)
    if: ${{ !inputs.ios_only && !inputs.tvos_only && !inputs.visionos_only && !inputs.android_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMSDK_VERSION: "6.0.13"
      RUST_TEST_NOCAPTURE: 1
      # opt-level 0 runs too (no function nears V8's limits on locals and
      # size), but five or six times slower; debug assertions and
      # overflow checks stay on.
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
        with:
          key: emscripten
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      # emcc's sysroot libraries, built on the first link
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/em-cache
          key: em-cache-${{ env.EMSDK_VERSION }}-${{ hashFiles('.cargo/config.toml') }}
      - run: echo "EM_CACHE=$RUNNER_TEMP/em-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # (the programs that ask for a browser, emscripten_browser,
      # emscripten_video, emscripten_events, emscripten_gl,
      # emscripten_audio, emscripten_joystick, emscripten_camera,
      # emscripten_asyncify, emscripten_jspi and sdl3-image's
      # emscripten_preload, run in the runner image's Chrome here too)
      - name: cargo test --workspace --target wasm32-unknown-emscripten
        shell: bash
        run: cargo test --workspace --target wasm32-unknown-emscripten 2>&1 | tee "$RUNNER_TEMP/test.log"
      # The paths that need a browser (the Battery Status API, window.open(),
      # devicemotion events, the canvas video driver, its DOM events and its
      # WebGL contexts, with the OpenGL ES 2 renderer, the Web Audio driver,
      # the Gamepad API driver on a stand-in Gamepad API, and the
      # getUserMedia() camera driver on stand-in media devices and Chrome's
      # fake camera, SDL_image's images the browser decodes as their files
      # are preloaded, and the programs linked with Asyncify and with JSPI,
      # which sleep in the browser's event loop) and the WebGL and Web
      # Audio probes, in the runner image's Chrome, headless, which must
      # have them.
      - name: cargo test -p sdl3 --test emscripten_browser --test emscripten_video --test emscripten_events --test emscripten_gl --test emscripten_audio --test emscripten_joystick --test emscripten_camera --test emscripten_asyncify --test emscripten_jspi, -p sdl3-image --test emscripten_preload (headless Chrome)
        shell: bash
        run: |
          "$CHROME" --version
          cargo test -p sdl3 --target wasm32-unknown-emscripten --test emscripten_browser --test emscripten_video --test emscripten_events --test emscripten_gl --test emscripten_audio --test emscripten_joystick --test emscripten_camera --test emscripten_asyncify --test emscripten_jspi 2>&1 | tee "$RUNNER_TEMP/browser.log"
          cargo test -p sdl3-image --target wasm32-unknown-emscripten --test emscripten_preload 2>&1 | tee -a "$RUNNER_TEMP/browser.log"
        env:
          SDL3_EMSCRIPTEN_BROWSER: 1
          SDL3_TEST_REQUIRE: browser,webgl,webaudio
          CHROME: /usr/bin/google-chrome
      # SDL_RunApp()'s IndexedDB storage (the emscripten-persistent-path
      # feature, with the path its program expects): in Chrome across a
      # reload of the page, and under node, which has no IndexedDB.
      - name: cargo test -p sdl3 --features emscripten-persistent-path --test emscripten_persistent_path (headless Chrome, node)
        shell: bash
        run: |
          cargo test -p sdl3 --target wasm32-unknown-emscripten --features emscripten-persistent-path --test emscripten_persistent_path 2>&1 | tee -a "$RUNNER_TEMP/browser.log"
          SDL3_EMSCRIPTEN_BROWSER=0 cargo test -p sdl3 --target wasm32-unknown-emscripten --features emscripten-persistent-path --test emscripten_persistent_path
        env:
          SDL_EMSCRIPTEN_PERSISTENT_PATH: /persistent
          SDL3_EMSCRIPTEN_BROWSER: 1
          CHROME: /usr/bin/google-chrome
      # The JavaScript layer's tests (sdl3-emscripten: em_js!, em_asm!, the
      # dependency table, the callback registry, the html5.h layouts) once
      # more in a release build: thin LTO keeps every #[used] static and
      # drops what nothing refers to, and emcc -O3 drops the glue's
      # unnamed JavaScript, which changes what the program holds.
      - name: cargo test -p sdl3-emscripten --release
        run: cargo test -p sdl3-emscripten --release --target wasm32-unknown-emscripten
      # Its documentation is only there on Emscripten (the crate is empty
      # elsewhere).
      - name: cargo doc -p sdl3-emscripten
        run: cargo doc --no-deps -p sdl3-emscripten --target wasm32-unknown-emscripten
        env:
          RUSTDOCFLAGS: -D warnings
      # The tests write SDL3_TEST_SKIP_LOG in their own in-memory file
      # system, so the skip log is made from the notes they print (with
      # RUST_TEST_NOCAPTURE), each with the test libtest names next (the
      # browser program prints such lines too), from both test steps.
      - name: List the skipped checks
        if: always()
        shell: bash
        run: |
          tools/ci/skips_from_log.py "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/browser.log" > "$RUNNER_TEMP/skips.tsv"
          tools/ci/list-skips.sh "$RUNNER_TEMP/skips.tsv" wasm32-unknown-emscripten

  # The test programs built for the iOS Simulator, run on a simulated
  # iPhone through tools/ios_run.py (the runner in .cargo/config.toml): see
  # "iOS Simulator" in docs/HARDWARE_TESTING.md. The device build is linked,
  # not run. (Linted on the Linux clippy runner, checked with 1.87 in the
  # test job.) Xcode, the simulator's runtime and its device are pinned.
  ios:
    name: test (aarch64-apple-ios-sim, iOS Simulator)
    if: ${{ !inputs.tvos_only && !inputs.visionos_only && !inputs.android_only }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      XCODE_VERSION: "16.4"
      # idb's Python client (the companion is Homebrew's current formula)
      FB_IDB_VERSION: "1.7.7"
      SDL3_IOS_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
      SDL3_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-5
      RUST_TEST_NOCAPTURE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          xcrun simctl list runtimes
      # idb (fb-idb's client and its idb_companion), which the runner's
      # tap and swipe requests touch the simulator's screen with (the
      # UIKit input program's real touches). The companion's Homebrew
      # formula only installs with an Xcode 26 selected, so one is for
      # that (before the simulator boots), then the pinned one again.
      - name: Install idb
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          xcode26=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode26"
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          idb_companion --version
          python3 -m venv "$RUNNER_TEMP/idb"
          "$RUNNER_TEMP/idb/bin/pip" install --quiet "fb-idb==$FB_IDB_VERSION"
          echo "SDL3_IOS_IDB=$RUNNER_TEMP/idb/bin/idb" >> "$GITHUB_ENV"
      # (rustup is on the runner image)
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-ios-sim,aarch64-apple-ios
          rustup default "$RUST_TOOLCHAIN"
      # (kept when the tests fail too: the build takes most of the job)
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
          cache-on-failure: true
      # The simulator is created and booted here; it finishes booting (a
      # minute or two, on a new device) while the programs build, and the
      # runner waits for that before the first program runs.
      - name: Boot the simulator
        run: echo "SDL3_IOS_SIMULATOR=$(tools/ios_run.py --boot)" >> "$GITHUB_ENV"
      # MoltenVK's framework for the iOS Simulator (a slice of the
      # release's dynamic MoltenVK.xcframework, in its MoltenVK-all.tar),
      # downloaded once and kept between runs (the archive is checked
      # again on every run): tools/ios_run.py bundles it in the apps that
      # ask for it and gives it to the spawned programs (SDL3_IOS_MOLTENVK).
      - name: Cache MoltenVK
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/moltenvk-cache
          key: moltenvk-all-${{ env.MOLTENVK_VERSION }}
      - name: Get MoltenVK
        env:
          SLICE: ios-arm64_x86_64-simulator
        run: |
          C="$RUNNER_TEMP/moltenvk-cache"
          mkdir -p "$C"
          if [ ! -f "$C/moltenvk-all.tar" ]; then
            curl -fsSL -o "$C/moltenvk-all.tar" "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-all.tar"
          fi
          echo "$MOLTENVK_ALL_SHA256  $C/moltenvk-all.tar" | shasum -a 256 -c
          X=MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework
          tar xf "$C/moltenvk-all.tar" -C "$RUNNER_TEMP" "$X/Info.plist" "$X/$SLICE"
          echo "SDL3_IOS_MOLTENVK=$RUNNER_TEMP/$X" >> "$GITHUB_ENV"
      - name: Build the tests
        env:
          TEST_ARGS: ${{ inputs.ios_test_args }}
        run: cargo test --no-run --target aarch64-apple-ios-sim ${TEST_ARGS:---workspace}
      - name: cargo test --workspace --target aarch64-apple-ios-sim
        shell: bash
        env:
          TEST_ARGS: ${{ inputs.ios_test_args }}
        run: cargo test --target aarch64-apple-ios-sim --no-fail-fast ${TEST_ARGS:---workspace} 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Link for devices (cargo build --workspace --all-targets --target aarch64-apple-ios)
        if: ${{ !cancelled() && !inputs.ios_test_args }}
        run: cargo build --workspace --all-targets --target aarch64-apple-ios
      # The skip log is made from the notes the programs print, as in the
      # Emscripten job, so that the apps' skips are in it too (an app's
      # files are in its own container).
      - name: List the skipped checks
        if: always()
        shell: bash
        run: |
          tools/ci/skips_from_log.py "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/skips.tsv"
          tools/ci/list-skips.sh "$RUNNER_TEMP/skips.tsv" aarch64-apple-ios-sim
      # The skips by design: the simulator's Metal device is below what the
      # GPU API's Metal backend asks for (metal, with upstream's "Device
      # does not meet the hardware requirements for SDL_GPU Metal": the
      # Metal renderer, which has a device there, must not skip), and
      # through MoltenVK it has no imageCubeArray or
      # drawIndirectFirstInstance, which the GPU API's Vulkan backend asks
      # for (vulkan, the GPU API's and the GPU renderer's checks, with what
      # the device lacks: the Vulkan renderer's checks, which run on it,
      # must not skip); and the offscreen driver has no EGL on Apple
      # platforms (egl). Any other skip (idb's, gles's and gamecontroller's
      # too) fails the job, in place of an SDL3_TEST_REQUIRE list.
      - name: Check the skips
        if: ${{ !cancelled() && !inputs.ios_test_args }}
        shell: bash
        run: |
          touch "$RUNNER_TEMP/skips.tsv"
          awk -F '\t' -v lacks=": Apple iOS simulator GPU has no imageCubeArray, drawIndirectFirstInstance" '
            $1 == "metal" && index($3, "hardware requirements for SDL_GPU Metal") { next }
            $1 == "vulkan" && $3 ~ /^no (Vulkan GPU device|GPU renderer|device) \((SDL_HINT_GPU_DRIVER vulkan unsupported!|PrepareDriver failed)\): / && substr($3, length($3) - length(lacks) + 1) == lacks { next }
            $1 != "egl"' "$RUNNER_TEMP/skips.tsv" > "$RUNNER_TEMP/unexpected.tsv"
          if [ -s "$RUNNER_TEMP/unexpected.tsv" ]; then
            cat "$RUNNER_TEMP/unexpected.tsv"
            echo "::error::checks skipped for other capabilities than egl, metal for another reason than the GPU API's hardware requirements, or vulkan for another one than the device features the GPU API's Vulkan backend needs (above)"
            exit 1
          fi
      # The results out of the long log: each program's, and on a failure
      # the panics with what follows them, libtest's lists, and the
      # simulator's log of the test programs (spawned from the target
      # directory, or installed as apps).
      - name: The test results
        if: always()
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test.log"
          # (without cargo's colors)
          perl -pe 's/\e\[[0-9;]*m//g' "$RUNNER_TEMP/test.log" | grep -E "^ *(Running|Doc-tests) |^test result: |^error: " || true
      - name: The failed tests and the simulator's log
        if: failure() && env.SDL3_IOS_SIMULATOR != ''
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test.log"
          grep -E -A12 "panicked at|^failures:$|targets? failed" "$RUNNER_TEMP/test.log" | cut -c1-400 | head -1500 || true
          # (a program that ended without libtest's summary, with what it
          # and the runner printed last)
          grep -E -B30 "process didn't exit" "$RUNNER_TEMP/test.log" | cut -c1-400 | head -1000 || true
          xcrun simctl spawn "$SDL3_IOS_SIMULATOR" log show --last 30m --style compact \
            --predicate 'processImagePath CONTAINS "/target/" OR processImagePath CONTAINS "/Containers/Bundle/Application/"' | tail -300 || true
      # (the runner stops the companions idb started; any left are
      # stopped here, so that the job doesn't end with them running)
      - name: Stop idb's companions
        if: always()
        run: pkill -x idb_companion || true

  # The test programs built for the tvOS Simulator, run on a simulated
  # Apple TV through tools/ios_run.py, as the iOS job runs them: the tests
  # and doctests as processes of the device, the UIKit programs that run on
  # tvOS (sdl3/tests/uikit_tvos*.rs and the iOS programs that take tvOS too)
  # as apps. See "tvOS Simulator" in docs/HARDWARE_TESTING.md. The device
  # build is linked, not run. (Linted on the Linux clippy runner.)
  tvos:
    name: test (aarch64-apple-tvos-sim, tvOS Simulator)
    if: ${{ !inputs.ios_only && !inputs.visionos_only && !inputs.android_only }}
    runs-on: macos-15
    timeout-minutes: 75
    env:
      XCODE_VERSION: "16.4"
      SDL3_TVOS_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K
      SDL3_TVOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.tvOS-18-5
      RUST_TEST_NOCAPTURE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          xcrun simctl list runtimes
      # (rustup is on the runner image)
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-tvos-sim,aarch64-apple-tvos
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          key: tvos
          cache-on-failure: true
      - name: Boot the simulator
        run: echo "SDL3_TVOS_SIMULATOR=$(tools/ios_run.py --boot tvos)" >> "$GITHUB_ENV"
      # MoltenVK's framework for the tvOS Simulator (a slice of the
      # release's dynamic MoltenVK.xcframework, in its MoltenVK-all.tar),
      # downloaded once and kept between runs (the archive is checked
      # again on every run): tools/ios_run.py bundles it in the apps that
      # ask for it and gives it to the spawned programs (SDL3_IOS_MOLTENVK).
      - name: Cache MoltenVK
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/moltenvk-cache
          key: moltenvk-all-${{ env.MOLTENVK_VERSION }}
      - name: Get MoltenVK
        env:
          SLICE: tvos-arm64_x86_64-simulator
        run: |
          C="$RUNNER_TEMP/moltenvk-cache"
          mkdir -p "$C"
          if [ ! -f "$C/moltenvk-all.tar" ]; then
            curl -fsSL -o "$C/moltenvk-all.tar" "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-all.tar"
          fi
          echo "$MOLTENVK_ALL_SHA256  $C/moltenvk-all.tar" | shasum -a 256 -c
          X=MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework
          tar xf "$C/moltenvk-all.tar" -C "$RUNNER_TEMP" "$X/Info.plist" "$X/$SLICE"
          echo "SDL3_IOS_MOLTENVK=$RUNNER_TEMP/$X" >> "$GITHUB_ENV"
      - name: Build the tests
        env:
          TEST_ARGS: ${{ inputs.tvos_test_args }}
        run: cargo test --no-run --target aarch64-apple-tvos-sim ${TEST_ARGS:---workspace}
      - name: cargo test --workspace --target aarch64-apple-tvos-sim
        shell: bash
        env:
          TEST_ARGS: ${{ inputs.tvos_test_args }}
        run: cargo test --target aarch64-apple-tvos-sim --no-fail-fast ${TEST_ARGS:---workspace} 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Link for devices (cargo build --workspace --all-targets --target aarch64-apple-tvos)
        if: ${{ !cancelled() && !inputs.tvos_test_args }}
        run: cargo build --workspace --all-targets --target aarch64-apple-tvos
      - name: List the skipped checks
        if: always()
        shell: bash
        run: |
          tools/ci/skips_from_log.py "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/skips.tsv"
          tools/ci/list-skips.sh "$RUNNER_TEMP/skips.tsv" aarch64-apple-tvos-sim
      # The skips by design, as in the iOS job: the GPU API's Metal backend
      # (the simulator's Metal device is below its requirements) and its
      # Vulkan backend (the device features MoltenVK hasn't there), and the
      # offscreen driver's EGL. Any other skip fails the job.
      - name: Check the skips
        if: ${{ !cancelled() && !inputs.tvos_test_args }}
        shell: bash
        run: |
          touch "$RUNNER_TEMP/skips.tsv"
          awk -F '\t' -v lacks=": Apple tvOS simulator GPU has no imageCubeArray, drawIndirectFirstInstance" '
            $1 == "metal" && index($3, "hardware requirements for SDL_GPU Metal") { next }
            $1 == "vulkan" && $3 ~ /^no (Vulkan GPU device|GPU renderer|device) \((SDL_HINT_GPU_DRIVER vulkan unsupported!|PrepareDriver failed)\): / && substr($3, length($3) - length(lacks) + 1) == lacks { next }
            $1 != "egl"' "$RUNNER_TEMP/skips.tsv" > "$RUNNER_TEMP/unexpected.tsv"
          if [ -s "$RUNNER_TEMP/unexpected.tsv" ]; then
            cat "$RUNNER_TEMP/unexpected.tsv"
            echo "::error::checks skipped for other capabilities than egl, metal for another reason than the GPU API's hardware requirements, or vulkan for another one than the device features the GPU API's Vulkan backend needs (above)"
            exit 1
          fi
      - name: The test results
        if: always()
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test.log"
          perl -pe 's/\e\[[0-9;]*m//g' "$RUNNER_TEMP/test.log" | grep -E "^ *(Running|Doc-tests) |^test result: |^error: " || true
      - name: The failed tests and the simulator's log
        if: failure() && env.SDL3_TVOS_SIMULATOR != ''
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test.log"
          grep -E -A12 "panicked at|^failures:$|targets? failed" "$RUNNER_TEMP/test.log" | cut -c1-400 | head -1500 || true
          grep -E -B30 "process didn't exit" "$RUNNER_TEMP/test.log" | cut -c1-400 | head -1000 || true
          xcrun simctl spawn "$SDL3_TVOS_SIMULATOR" log show --last 30m --style compact \
            --predicate 'processImagePath CONTAINS "/target/" OR processImagePath CONTAINS "/Containers/Bundle/Application/"' | tail -300 || true

  # The test programs built for the visionOS Simulator, run on a simulated
  # Apple Vision Pro through tools/ios_run.py, as the iOS and tvOS jobs run
  # theirs: the sdl3 library's tests as processes of the device, the UIKit
  # programs that run on visionOS (sdl3/tests/uikit_visionos*.rs and the
  # iOS programs that take visionOS too) as apps. See "visionOS Simulator"
  # in docs/HARDWARE_TESTING.md. The device build is linked, not run.
  # (Linted on the Linux clippy runner.)
  visionos:
    name: test (aarch64-apple-visionos-sim, visionOS Simulator)
    if: ${{ !inputs.ios_only && !inputs.tvos_only && !inputs.android_only }}
    runs-on: macos-15
    timeout-minutes: 75
    env:
      XCODE_VERSION: "16.4"
      SDL3_VISIONOS_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.Apple-Vision-Pro
      SDL3_VISIONOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.xrOS-2-5
      RUST_TEST_NOCAPTURE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # (the sdl3 library's tests and the visionOS app programs: the other
      # crates are pure code the iOS and tvOS jobs run)
      DEFAULT_TEST_ARGS: -p sdl3 --lib --test uikit_visionos --test uikit_visionos_input --test uikit_main --test uikit_callbacks --test uikit_metal --test uikit_input --test uikit_vulkan
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          xcrun simctl list runtimes
      # (rustup is on the runner image)
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-visionos-sim,aarch64-apple-visionos
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          key: visionos
          cache-on-failure: true
      - name: Boot the simulator
        run: echo "SDL3_VISIONOS_SIMULATOR=$(tools/ios_run.py --boot visionos)" >> "$GITHUB_ENV"
      # MoltenVK's framework for the visionOS Simulator (a slice of the
      # release's dynamic MoltenVK.xcframework, in its MoltenVK-all.tar),
      # downloaded once and kept between runs (the archive is checked
      # again on every run): tools/ios_run.py bundles it in the apps that
      # ask for it and gives it to the spawned programs (SDL3_IOS_MOLTENVK).
      - name: Cache MoltenVK
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/moltenvk-cache
          key: moltenvk-all-${{ env.MOLTENVK_VERSION }}
      - name: Get MoltenVK
        env:
          SLICE: xros-arm64_x86_64-simulator
        run: |
          C="$RUNNER_TEMP/moltenvk-cache"
          mkdir -p "$C"
          if [ ! -f "$C/moltenvk-all.tar" ]; then
            curl -fsSL -o "$C/moltenvk-all.tar" "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-all.tar"
          fi
          echo "$MOLTENVK_ALL_SHA256  $C/moltenvk-all.tar" | shasum -a 256 -c
          X=MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework
          tar xf "$C/moltenvk-all.tar" -C "$RUNNER_TEMP" "$X/Info.plist" "$X/$SLICE"
          echo "SDL3_IOS_MOLTENVK=$RUNNER_TEMP/$X" >> "$GITHUB_ENV"
      - name: Build the tests
        env:
          TEST_ARGS: ${{ inputs.visionos_test_args }}
        run: cargo test --no-run --target aarch64-apple-visionos-sim ${TEST_ARGS:-$DEFAULT_TEST_ARGS}
      - name: cargo test --target aarch64-apple-visionos-sim
        shell: bash
        env:
          TEST_ARGS: ${{ inputs.visionos_test_args }}
        run: cargo test --target aarch64-apple-visionos-sim --no-fail-fast ${TEST_ARGS:-$DEFAULT_TEST_ARGS} 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Link for devices (cargo build -p sdl3 --all-targets --target aarch64-apple-visionos)
        if: ${{ !cancelled() && !inputs.visionos_test_args }}
        run: cargo build -p sdl3 --all-targets --target aarch64-apple-visionos
      - name: List the skipped checks
        if: always()
        shell: bash
        run: |
          tools/ci/skips_from_log.py "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/skips.tsv"
          tools/ci/list-skips.sh "$RUNNER_TEMP/skips.tsv" aarch64-apple-visionos-sim
      # The skips by design: Vulkan, whose library (MoltenVK) upstream's
      # SDL_LoadObject() refuses to load on visionOS (it requires iOS 8,
      # and takes visionOS's version for iOS's: a FIXME (upstream)), with
      # that in the reason; the offscreen driver's EGL, as in the iOS and
      # tvOS jobs; idb, which isn't installed for the visionOS Simulator
      # (uikit_input's real touches); and the GPU API's indirect draws and
      # dispatches, which the simulator's Metal device hasn't (Apple1 and
      # Apple2 only: upstream takes any device on visionOS). Any other skip
      # fails the job.
      - name: Check the skips
        if: ${{ !cancelled() && !inputs.visionos_test_args }}
        shell: bash
        run: |
          touch "$RUNNER_TEMP/skips.tsv"
          awk -F '\t' -v loadso="(upstream's SDL_LoadObject() requires iOS 8+, and visionOS's version is below 8)" '
            $1 == "metal" && index($3, "no indirect draws or dispatches") { next }
            $1 == "vulkan" && substr($3, length($3) - length(loadso) + 1) == loadso { next }
            $1 != "egl" && $1 != "idb"' "$RUNNER_TEMP/skips.tsv" > "$RUNNER_TEMP/unexpected.tsv"
          if [ -s "$RUNNER_TEMP/unexpected.tsv" ]; then
            cat "$RUNNER_TEMP/unexpected.tsv"
            echo "::error::checks skipped for other capabilities than egl and idb, metal for another reason than the simulator's indirect arguments, or vulkan for another one than upstream's SDL_LoadObject() on visionOS (above)"
            exit 1
          fi
      - name: The test results
        if: always()
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test.log"
          perl -pe 's/\e\[[0-9;]*m//g' "$RUNNER_TEMP/test.log" | grep -E "^ *(Running|Doc-tests) |^test result: |^error: " || true
      - name: The failed tests and the simulator's log
        if: failure() && env.SDL3_VISIONOS_SIMULATOR != ''
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test.log"
          grep -E -A12 "panicked at|^failures:$|targets? failed" "$RUNNER_TEMP/test.log" | cut -c1-400 | head -1500 || true
          grep -E -B30 "process didn't exit" "$RUNNER_TEMP/test.log" | cut -c1-400 | head -1000 || true
          xcrun simctl spawn "$SDL3_VISIONOS_SIMULATOR" log show --last 30m --style compact \
            --predicate 'processImagePath CONTAINS "/target/" OR processImagePath CONTAINS "/Containers/Bundle/Application/"' | tail -300 || true

  # The test programs built for Android, run on an Android emulator through
  # tools/android_run.py (the runner in .cargo/config.toml, which pushes
  # each program with adb and runs it as a process of the device, with the
  # workspace's test data copied there) and linked with the NDK by
  # tools/android_link.py: see "Android emulator" in
  # docs/HARDWARE_TESTING.md. The x86-64 build, and the arm64 one through
  # the emulator's ARM translation. (Linted on the Linux clippy runner,
  # checked with 1.87 in the test job.) The emulator, its system image and
  # the NDK are pinned; nothing of the emulator is cached (the image and a
  # booted device's snapshot would take 4 GB of the repository's cache for
  # about 40 s: the emulator boots while the programs build).
  # (diag branch only) The C references of sdl3/tests/android_*.rs:
  # upstream's android-project with each C program of the android_cref
  # input (a .tar.gz, base64: NAME.c programs and their headers), built
  # with Gradle and CMake, run by the runner's --run-apk on the same
  # emulator, one after the other.
  cref:
    name: C reference (upstream's android-project with Gradle)
    if: ${{ inputs.android_cref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_EMULATOR_BUILD: "16428233"
      ANDROID_EMULATOR_SHA256: b08fc43d8608d2955f607f1b287beb525041e730086bdca3af152accac3af9c1
      ANDROID_IMAGE_ARCHIVE: x86_64-35_r09.zip
      ANDROID_IMAGE_SHA256: c67b9ba0ff5bc0eb6d046871bfa228af14d4d47b02f0cdae94f048e511b7566e
      SDL3_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
      ANDROID_NDK_VERSION: "29.0.14206865"
      SDL3_ANDROID_BUILD_TOOLS: "35.0.0"
      SDL3_ANDROID_TIMEOUT: 600
      UPSTREAM_COMMIT: ea7a2dabfd1ab6b0a5720568ffd207f5825e47f1
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator and its system image
        run: |
          D="$RUNNER_TEMP/android-download"
          mkdir -p "$D"
          curl -fsSL -o "$D/emulator.zip" "https://dl.google.com/android/repository/emulator-linux_x64-$ANDROID_EMULATOR_BUILD.zip"
          curl -fsSL -o "$D/image.zip" "https://dl.google.com/android/repository/sys-img/google_apis/$ANDROID_IMAGE_ARCHIVE"
          echo "$ANDROID_EMULATOR_SHA256  $D/emulator.zip" | sha256sum -c
          echo "$ANDROID_IMAGE_SHA256  $D/image.zip" | sha256sum -c
          rm -rf "$ANDROID_HOME/emulator"
          unzip -q "$D/emulator.zip" -d "$ANDROID_HOME"
          I="$ANDROID_HOME/$(echo "$SDL3_ANDROID_SYSTEM_IMAGE" | tr ';' /)"
          rm -rf "$I"
          mkdir -p "$(dirname "$I")"
          unzip -q "$D/image.zip" -d "$(dirname "$I")"
          rm -rf "$D"
          sudo apt-get install -y -q libpulse0 > /dev/null || { sudo apt-get update -q > /dev/null && sudo apt-get install -y -q libpulse0 > /dev/null; }
      - name: Start the emulator
        run: echo "SDL3_ANDROID_SERIAL=$(tools/android_run.py --boot)" >> "$GITHUB_ENV"
      - name: Build upstream's android-project with each C reference
        env:
          CREF: ${{ inputs.android_cref }}
        run: |
          up="$RUNNER_TEMP/upstream"
          proj="$RUNNER_TEMP/cref"
          src="$RUNNER_TEMP/cref-src"
          mkdir -p "$src" "$RUNNER_TEMP/apks"
          if [ "$CREF" = file ]; then base64 -d .github/diag-cref.b64 | tar -xz -C "$src"; else echo "$CREF" | base64 -d | tar -xz -C "$src"; fi
          ls -la "$src"
          git init -q "$up"
          git -C "$up" fetch -q --depth 1 https://github.com/libsdl-org/SDL "$UPSTREAM_COMMIT"
          git -C "$up" checkout -q FETCH_HEAD
          # Upstream's GLES2 program cache: moving the tail entry to the
          # front leaves `tail` on it, and an eviction leaves the new
          # tail's `next` on the freed entry, so destroying the renderer
          # after the scenes frees an entry twice. Both fixed, as the Rust
          # cache (a Vec) behaves (as for the iOS references).
          G="$up/src/render/opengles2/SDL_render_gles2.c"
          perl -0pi -e 's/(            if \(entry->prev\) \{\n                entry->prev->next = entry->next;\n            \}\n)/$1            if (data->program_cache.tail == entry) {\n                data->program_cache.tail = entry->prev;\n            }\n/' "$G"
          perl -0pi -e 's/(        data->program_cache.tail = oldest->prev;\n)/$1        if (data->program_cache.tail) {\n            data->program_cache.tail->next = NULL;\n        }\n/' "$G"
          # (and the input's patches of upstream: the Rust translation's
          # fixes, for the references of the checks they change)
          for p in "$src"/*.patch; do
            if [ -e "$p" ]; then git -C "$up" apply -v "$p"; fi
          done
          git -C "$up" diff --stat
          cp -r "$up/android-project" "$proj"
          ln -s "$up" "$proj/app/jni/SDL"
          cp "$src"/*.h "$proj/app/jni/src/"
          sed -i 's/YourSourceHere.c/main.c/' "$proj/app/jni/src/CMakeLists.txt"
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'x86_64'/" "$proj/app/build.gradle"
          sed -i "s/ndkVersion = \"28.2.13676358\"/ndkVersion = \"$ANDROID_NDK_VERSION\"/" "$proj/app/build.gradle"
          cd "$proj"
          for c in "$src"/*.c; do
            n=$(basename "$c" .c)
            cp "$c" app/jni/src/main.c
            s=$(date +%s)
            ./gradlew --no-daemon -q -PBUILD_WITH_CMAKE assembleDebug 2>&1 | tail -40
            echo "gradle $n: $(( $(date +%s) - s )) s"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apks/$n.apk"
          done
          ls -la "$RUNNER_TEMP/apks"
      - name: Run the C references
        env:
          SDL3_ANDROID_VERBOSE: 1
        run: |
          status=0
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            n=$(basename "$apk" .apk)
            echo "===== $n"
            s=$(date +%s)
            rc=0
            if [ "$n" = android_dialog ]; then export SDL3_ANDROID_LAUNCH_DATA=file:///sdcard/Download/sdl3_dialog/dropped.txt; else unset SDL3_ANDROID_LAUNCH_DATA; fi
            tools/android_run.py --run-apk "$apk" org.libsdl.app | tee "$RUNNER_TEMP/$n.txt" || rc=$?
            echo "--run-apk $n: exit status $rc, $(( $(date +%s) - s )) s"
            echo "--- the trace of $n"
            python3 - "$RUNNER_TEMP/$n.txt" "$n" <<'EOF'
          import sys
          lines = []
          for raw in open(sys.argv[1], encoding="utf-8", errors="replace"):
              text = raw.rstrip("\n")
              if text.startswith("trace: "):
                  lines.append(text[len("trace: "):])
              elif text.startswith("sdl3-android-runner: reply "):
                  lines.append("logcat: " + text[len("sdl3-android-runner: reply "):])
          for line in lines:
              print(f"EXPECTED[{sys.argv[2]}]| " + line)
          print(f"({len(lines)} lines)")
          EOF
            "$ANDROID_HOME/platform-tools/adb" -s "$SDL3_ANDROID_SERIAL" logcat -d -v threadtime | grep -E " (SDL|SDL/[A-Z]+|AndroidRuntime|DEBUG|libc|ActivityTaskManager|ActivityManager) *:" | tail -150 | sed "s/^/LOG[$n]| /" || true
            test "$rc" = 0 || status=1
          done
          exit $status
      - name: Stop the emulator
        if: always()
        run: tools/android_run.py --kill

  # (diag branch only) What isn't ready for an app right after the
  # emulator's sys.boot_completed: fresh virtual devices (first boots), an
  # app of the runner's launched at once (the runner's readiness wait off),
  # and the device's readiness each second meanwhile.
  bootprobe:
    name: boot probe
    if: ${{ inputs.android_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_EMULATOR_BUILD: "16428233"
      ANDROID_EMULATOR_SHA256: b08fc43d8608d2955f607f1b287beb525041e730086bdca3af152accac3af9c1
      ANDROID_IMAGE_ARCHIVE: x86_64-35_r09.zip
      ANDROID_IMAGE_SHA256: c67b9ba0ff5bc0eb6d046871bfa228af14d4d47b02f0cdae94f048e511b7566e
      SDL3_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
      ANDROID_NDK_VERSION: "29.0.14206865"
      SDL3_ANDROID_BUILD_TOOLS: "35.0.0"
      SDL3_ANDROID_PLATFORM: "35"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator, its system image and the NDK
        run: |
          df -h /
          D="$RUNNER_TEMP/android-download"
          mkdir -p "$D"
          curl -fsSL -o "$D/emulator.zip" "https://dl.google.com/android/repository/emulator-linux_x64-$ANDROID_EMULATOR_BUILD.zip"
          curl -fsSL -o "$D/image.zip" "https://dl.google.com/android/repository/sys-img/google_apis/$ANDROID_IMAGE_ARCHIVE"
          echo "$ANDROID_EMULATOR_SHA256  $D/emulator.zip" | sha256sum -c
          echo "$ANDROID_IMAGE_SHA256  $D/image.zip" | sha256sum -c
          rm -rf "$ANDROID_HOME/emulator"
          unzip -q "$D/emulator.zip" -d "$ANDROID_HOME"
          I="$ANDROID_HOME/$(echo "$SDL3_ANDROID_SYSTEM_IMAGE" | tr ';' /)"
          rm -rf "$I"
          mkdir -p "$(dirname "$I")"
          unzip -q "$D/image.zip" -d "$(dirname "$I")"
          rm -rf "$D"
          sudo apt-get install -y -q libpulse0 > /dev/null || { sudo apt-get update -q > /dev/null && sudo apt-get install -y -q libpulse0 > /dev/null; }
          if [ ! -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          fi
          echo "SDL3_ANDROID_NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          df -h /
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-linux-android
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: false
      - name: Build android_runner
        run: cargo test --no-run --target x86_64-linux-android -p sdl3 --test android_runner
      - name: Boot and launch at once, four times
        shell: bash
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          exe=$(cargo test --target x86_64-linux-android -p sdl3 --test android_runner --no-run --message-format=json 2>/dev/null |
            python3 -c 'import json, sys; print([m["executable"] for m in map(json.loads, sys.stdin) if m.get("executable")][-1])')
          for i in 1 2 3 4; do
            echo "===== boot $i"
            tools/android_run.py --kill || true
            rm -rf "$HOME/.android/avd"
            S=$(tools/android_run.py --boot)
            t0=$(date +%s.%N)
            until [ "$(timeout 10 "$ADB" -s "$S" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do sleep 0.5; done
            echo "boot_completed after $(echo "$(date +%s.%N) - $t0" | bc) s"
            ( t1=$(date +%s.%N); for j in $(seq 1 80); do
                echo "t+$(echo "$(date +%s.%N) - $t1" | bc | cut -c1-5): $(timeout 20 "$ADB" -s "$S" shell 'pm path android 2>&1 | head -1; dumpsys activity activities | grep -E "topResumedActivity=" | head -1; cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.HOME | tail -1; dumpsys window | grep -E "mCurrentFocus=|mFocusedApp=" | head -2; dumpsys window | grep -E "isKeyguardShowing|mShowingLockscreen|KeyguardController" | head -2' 2>&1 | tr -s ' \n\r' ' ' | cut -c1-500)"
                sleep 1; done ) > "$RUNNER_TEMP/probe_$i.txt" 2>&1 &
            P=$!
            rc=0
            SDL3_ANDROID_SERIAL="$S" SDL3_ANDROID_VERBOSE=1 timeout 400 tools/android_run.py "$exe" > "$RUNNER_TEMP/run_$i.txt" 2>&1 || rc=$?
            echo "run $i: exit status $rc"
            grep -E "am start|didn't connect|booted|ready|failed|process|waiting" "$RUNNER_TEMP/run_$i.txt" | cut -c1-400 | head -30
            wait $P || true
            cat "$RUNNER_TEMP/probe_$i.txt" | head -40
            timeout 60 "$ADB" -s "$S" logcat -d -b main,system,crash -v time | grep -E "sdl3_rust|org.libsdl|Start proc|Displayed|adbd|keyguard|Keyguard" | head -120 || true
          done
          tools/android_run.py --kill || true
  android:
    name: test (x86_64-linux-android, Android emulator)
    if: ${{ !inputs.ios_only && !inputs.tvos_only && !inputs.visionos_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The emulator's build (37.2.12.0) and the API 35 Google APIs x86-64
      # system image's revision (Android 15), as the SDK repository has
      # them, with their archives' SHA-256
      ANDROID_EMULATOR_BUILD: "16428233"
      ANDROID_EMULATOR_SHA256: b08fc43d8608d2955f607f1b287beb525041e730086bdca3af152accac3af9c1
      ANDROID_IMAGE_ARCHIVE: x86_64-35_r09.zip
      ANDROID_IMAGE_SHA256: c67b9ba0ff5bc0eb6d046871bfa228af14d4d47b02f0cdae94f048e511b7566e
      SDL3_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
      # (on the runner image, which points ANDROID_NDK_ROOT to r27)
      ANDROID_NDK_VERSION: "29.0.14206865"
      # The build-tools and platform the app packages are made with (on the
      # runner image)
      SDL3_ANDROID_BUILD_TOOLS: "35.0.0"
      SDL3_ANDROID_PLATFORM: "35"
      RUST_TEST_NOCAPTURE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # (a program that hangs fails after that, the others still run; the
      # slowest, sdl3-mixer's and sdl3-image's, take two minutes, six under
      # the ARM translation)
      SDL3_ANDROID_TIMEOUT: 900
      ARM64_TEST_ARGS: -p sdl3 -p sdl3-image -p sdl3-shadercross --lib
    steps:
      - uses: actions/checkout@v5
      # (the runner's /dev/kvm is the kvm group's)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # The virtual device's data partition takes 14.4 GB of the disk (its
      # 12 GB, and the emulator's margin), which the build and its cache
      # leave too little of on some runners (the emulator then ends at
      # once: "Not enough space to create userdata partition"): the runner
      # image's toolchains this job doesn't use, removed.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /usr/local/lib/node_modules
          df -h /
      # The emulator and the system image from the SDK repository's
      # archives, checked against their SHA-256 (sdkmanager installs only
      # the newest ones), in the SDK where it would put them; PulseAudio's
      # library, which the emulator needs to start (with or without sound);
      # and the NDK, which the runner image has.
      - name: Install the emulator, its system image and the NDK
        run: |
          D="$RUNNER_TEMP/android-download"
          mkdir -p "$D"
          curl -fsSL -o "$D/emulator.zip" "https://dl.google.com/android/repository/emulator-linux_x64-$ANDROID_EMULATOR_BUILD.zip"
          curl -fsSL -o "$D/image.zip" "https://dl.google.com/android/repository/sys-img/google_apis/$ANDROID_IMAGE_ARCHIVE"
          echo "$ANDROID_EMULATOR_SHA256  $D/emulator.zip" | sha256sum -c
          echo "$ANDROID_IMAGE_SHA256  $D/image.zip" | sha256sum -c
          rm -rf "$ANDROID_HOME/emulator"
          unzip -q "$D/emulator.zip" -d "$ANDROID_HOME"
          I="$ANDROID_HOME/$(echo "$SDL3_ANDROID_SYSTEM_IMAGE" | tr ';' /)"
          rm -rf "$I"
          mkdir -p "$(dirname "$I")"
          unzip -q "$D/image.zip" -d "$(dirname "$I")"
          rm -rf "$D"
          grep -E '^Pkg.Revision|^AndroidVersion.ApiLevel|^SystemImage.(Abi|TagId)' "$I/source.properties"
          sudo apt-get install -y -q libpulse0 > /dev/null || { sudo apt-get update -q > /dev/null && sudo apt-get install -y -q libpulse0 > /dev/null; }
          "$ANDROID_HOME/emulator/emulator" -version | head -1
          "$ANDROID_HOME/emulator/emulator" -accel-check
          if [ ! -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          fi
          echo "SDL3_ANDROID_NDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      # (rustup is on the runner image)
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-linux-android,aarch64-linux-android
          rustup default "$RUST_TOOLCHAIN"
      # (kept when the tests fail too: the build takes most of the job)
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
      # The emulator starts here, on a virtual device the runner writes; it
      # boots while the programs build (a minute or two with the build
      # taking the CPUs), and the runner waits for that before the first
      # program runs.
      - name: Start the emulator
        run: echo "SDL3_ANDROID_SERIAL=$(tools/android_run.py --boot)" >> "$GITHUB_ENV"
      - name: Build the tests
        env:
          TEST_ARGS: ${{ inputs.android_test_args }}
        run: cargo test --no-run --target x86_64-linux-android ${TEST_ARGS:---workspace}
      - name: cargo test --workspace --target x86_64-linux-android
        shell: bash
        env:
          TEST_ARGS: ${{ inputs.android_test_args }}
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
        run: cargo test --target x86_64-linux-android --no-fail-fast ${TEST_ARGS:---workspace} 2>&1 | tee "$RUNNER_TEMP/test.log"
      # The app mode once more, with arguments and a variable (the same
      # string, which comes through the manifest and the arguments each its
      # own way: android_runner.rs compares them), and android_spawned.rs
      # the same way; then both with an exit status of 3, which the runner
      # must give; then the app package itself: dexdump (which verifies
      # the DEX file as ART does), apksigner and zipalign check it; and
      # android_backends.rs's, with its assets and permissions.
      - name: The app mode's arguments, variables and exit status, and the app package
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SDL3_ANDROID_RUNNER_CHECK: "two  words\ttab, \"quoted\", 'single', a\\backslash, <&>, \u00e9\u20ac\U0001F600"
          SDL3_ANDROID_VERBOSE: 1
        run: |
          set -o pipefail
          # (its output again at the end of the log when the job fails)
          exec > >(tee "$RUNNER_TEMP/app-mode.log") 2>&1
          for t in android_runner android_spawned; do
            cargo test --target x86_64-linux-android -p sdl3 --test $t -- "$SDL3_ANDROID_RUNNER_CHECK" second ''
          done
          exe() {
            cargo test --target x86_64-linux-android -p sdl3 --test "$1" --no-run --message-format=json 2>/dev/null |
              python3 -c 'import json, sys; print([m["executable"] for m in map(json.loads, sys.stdin) if m.get("executable")][-1])'
          }
          for t in android_runner android_spawned; do
            rc=0
            env -u SDL3_ANDROID_RUNNER_CHECK SDL3_ANDROID_RUNNER_EXIT=3 tools/android_run.py "$(exe $t)" || rc=$?
            echo "$t: exit status $rc"
            test "$rc" = 3
          done
          BT="$ANDROID_HOME/build-tools/$SDL3_ANDROID_BUILD_TOOLS"
          tools/android_run.py --apk "$(exe android_runner)" "$RUNNER_TEMP/android_runner.apk"
          unzip -l "$RUNNER_TEMP/android_runner.apk"
          "$BT/dexdump" -c "$RUNNER_TEMP/android_runner.apk"
          "$BT/dexdump" -d "$RUNNER_TEMP/android_runner.apk" | tee "$RUNNER_TEMP/dexdump.txt" | head -80
          if grep -E "ERROR|Failure" "$RUNNER_TEMP/dexdump.txt"; then exit 1; fi
          "$BT/apksigner" verify --min-sdk-version 21 --print-certs "$RUNNER_TEMP/android_runner.apk"
          "$BT/zipalign" -c -P 16 -v 4 "$RUNNER_TEMP/android_runner.apk" | tail -5
          # ART's verifier on the device (dex2oat's verify filter, forced)
          ADB="$ANDROID_HOME/platform-tools/adb"
          P=org.libsdl.sdl3_rust.android_runner
          "$ADB" logcat -b all -c
          "$ADB" install -r -t "$RUNNER_TEMP/android_runner.apk"
          "$ADB" shell cmd package compile -m verify -f "$P" | tee "$RUNNER_TEMP/compile.txt"
          grep -q Success "$RUNNER_TEMP/compile.txt"
          "$ADB" shell pm art dump "$P" | head -20
          "$ADB" logcat -d | grep -E "dex2oat|ArtService|VerifyError|Rejecting class|[Vv]erification" | grep -E "$P|org[./]libsdl" | tee "$RUNNER_TEMP/verify.txt" | tail -20
          if grep -E "VerifyError|Rejecting class|[Vv]erification (of .*)?failed|status=FAILED" "$RUNNER_TEMP/verify.txt"; then exit 1; fi
          "$ADB" uninstall "$P"
          CARGO_MANIFEST_DIR="$PWD/sdl3" tools/android_run.py --apk "$(exe android_backends)" "$RUNNER_TEMP/android_backends.apk"
          unzip -l "$RUNNER_TEMP/android_backends.apk" 'assets/*'
          "$BT/aapt2" dump permissions "$RUNNER_TEMP/android_backends.apk"
          "$BT/zipalign" -c -P 16 4 "$RUNNER_TEMP/android_backends.apk"
      # The arm64 build, through the emulator's ARM translation (the image
      # runs arm64-v8a programs, about three times slower): the libraries
      # with code of their own for arm64 (sdl3's CPU features, blitters
      # and assertions, sdl3-image's libyuv paths, sdl3-shadercross's
      # target checks). The rest is the same code as the x86-64 build's,
      # and would take the job from about 16 minutes to about 35.
      - name: cargo test -p sdl3 -p sdl3-image -p sdl3-shadercross --lib --target aarch64-linux-android (ARM translation)
        if: ${{ !cancelled() && !inputs.android_test_args }}
        shell: bash
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips-arm64.tsv
        run: |
          cargo test --no-run --target aarch64-linux-android $ARM64_TEST_ARGS
          cargo test --target aarch64-linux-android --no-fail-fast $ARM64_TEST_ARGS 2>&1 | tee "$RUNNER_TEMP/test-arm64.log"
      # (the programs write their skips on the device; the runner appends
      # them to the host's skip log)
      - name: List the skipped checks
        if: always()
        shell: bash
        run: |
          touch "$RUNNER_TEMP/skips.tsv" "$RUNNER_TEMP/skips-arm64.tsv"
          tools/ci/list-skips.sh "$RUNNER_TEMP/skips.tsv" x86_64-linux-android
          tools/ci/list-skips.sh "$RUNNER_TEMP/skips-arm64.tsv" "aarch64-linux-android, ARM translation"
      # The skips by design: the desktop OpenGL renderer's checks (egl:
      # Android has OpenGL ES only, and the renderer isn't built), and the
      # checks that draw with OpenGL ES or present with Vulkan on the
      # offscreen driver's windows, which need EGL's device platform (egl,
      # with upstream's "EXT_device_enumeration not supported" in the
      # reason) and VK_EXT_headless_surface (vulkan), which Android hasn't
      # (those draw on the android video driver's windows in the app tests,
      # android_gles.rs and android_vulkan.rs: the driver needs an app's
      # Java VM, so spawned tests can't have it). Any other skip fails the
      # job.
      - name: Check the skips
        if: ${{ !cancelled() && !inputs.android_test_args }}
        shell: bash
        run: |
          cat "$RUNNER_TEMP/skips.tsv" "$RUNNER_TEMP/skips-arm64.tsv" | awk -F '\t' '
            $1 == "egl" && $2 ~ /^render::opengl::tests::/ { next }
            $1 == "egl" && index($3, "(EXT_device_enumeration not supported by the drivers?)") { next }
            $1 == "vulkan" && index($3, "VK_EXT_headless_surface") { next }
            { print }' > "$RUNNER_TEMP/unexpected.tsv"
          if [ -s "$RUNNER_TEMP/unexpected.tsv" ]; then
            sort -u "$RUNNER_TEMP/unexpected.tsv"
            echo "::error::checks skipped for other reasons than the desktop OpenGL renderer, EGL's device platform or VK_EXT_headless_surface (above)"
            exit 1
          fi
      - name: The test results
        if: always()
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/test-arm64.log"
          for log in "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/test-arm64.log"; do
            echo "== $(basename "$log")"
            perl -pe 's/\e\[[0-9;]*m//g' "$log" | grep -E "^ *(Running|Doc-tests) |^test result: |^error: " || true
          done
      # (adb waits for a device that isn't there, as an emulator that never
      # started: each call is bounded, and the step too)
      - name: The failed tests and the device's log
        if: failure() && env.SDL3_ANDROID_SERIAL != ''
        timeout-minutes: 5
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/test-arm64.log"
          for log in "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/test-arm64.log"; do
            grep -E -A12 "panicked at|^failures:$|targets? failed" "$log" | cut -c1-400 | head -1500 || true
            grep -E -B30 "process didn't exit|android_run.py: " "$log" | cut -c1-400 | head -1000 || true
          done
          ADB="$ANDROID_HOME/platform-tools/adb"
          if [ "$(timeout 20 "$ADB" -s "$SDL3_ANDROID_SERIAL" get-state 2>/dev/null)" = device ]; then
            timeout 60 "$ADB" -s "$SDL3_ANDROID_SERIAL" logcat -d -b crash | tail -300 || true
            timeout 60 "$ADB" -s "$SDL3_ANDROID_SERIAL" logcat -d | tail -300 || true
          else
            echo "($SDL3_ANDROID_SERIAL isn't a device adb can reach: no device log)"
          fi
          # (the emulator's own log, where tools/android_run.py keeps it)
          tail -100 "${TMPDIR:-/tmp}/sdl3-android-run-$(id -u)/$SDL3_ANDROID_SERIAL/emulator.log" || true
          # (last: the app mode's step, whose output the logs above push out of a
          # log's last lines)
          if [ -f "$RUNNER_TEMP/app-mode.log" ]; then echo "== the app mode's step"; tail -200 "$RUNNER_TEMP/app-mode.log"; fi
      - name: Stop the emulator
        if: always()
        run: tools/android_run.py --kill

  doc:
    name: rustdoc
    if: ${{ !inputs.ios_only && !inputs.tvos_only && !inputs.visionos_only && !inputs.android_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios-sim,aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The Apple and UIKit-only documentation (no SDK is needed)
      - run: cargo doc --workspace --no-deps --target aarch64-apple-ios-sim
        env:
          RUSTDOCFLAGS: -D warnings
      # The Android documentation (no NDK is needed)
      - run: cargo doc --workspace --no-deps --target aarch64-linux-android
        env:
          RUSTDOCFLAGS: -D warnings
