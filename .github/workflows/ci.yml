name: CI

# A throwaway iOS-simulator spike (plan PR 0): this branch only, never main.
on:
  push:
    branches: [claude/diag-ios-spike]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  UPSTREAM_COMMIT: ea7a2dabfd1ab6b0a5720568ffd207f5825e47f1

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: spike probes (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "16.4"
            runtime: "18."
          - xcode: "26"
            runtime: "26."
    env:
      SPIKE_RUNTIME_PREFIX: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v5
      - name: Environment and Xcode
        run: |
          set -x
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; df -h /
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; else echo "NO Xcode ${{ matrix.xcode }}; default kept"; fi
          xcode-select -p; xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version; xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -iE "iphone|ipad" | head -40
          xcrun simctl list devices available | head -40
          rustup --version; python3 --version; cmake --version | head -1; command -v ninja || true; brew --version | head -1
      - name: Install the Rust toolchain and iOS targets (timed)
        run: |
          s=$(date +%s)
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-ios-sim,aarch64-apple-ios
          rustup default "$RUST_TOOLCHAIN"
          echo "TIMING toolchain install $(( $(date +%s) - s ))s"
          rustc -vV
      - name: Boot a simulator (timed)
        working-directory: ios-spike
        run: ./run.py boot
      - name: Build the spike crate (timed)
        working-directory: ios-spike
        run: |
          s=$(date +%s); cargo build --target aarch64-apple-ios-sim --bins; echo "TIMING sim bins $(( $(date +%s) - s ))s"
          s=$(date +%s); cargo test --no-run --target aarch64-apple-ios-sim; echo "TIMING sim test --no-run $(( $(date +%s) - s ))s"
          s=$(date +%s); cargo build --target aarch64-apple-ios --bins; echo "TIMING device bins $(( $(date +%s) - s ))s"
          file target/aarch64-apple-ios-sim/debug/spawn_probe target/aarch64-apple-ios/debug/uikit_app
      - name: simctl spawn experiments
        working-directory: ios-spike
        run: ./spawn_tests.sh
      - name: libtest through a simctl-spawn cargo runner
        working-directory: ios-spike
        run: ./libtest_tests.sh
      - name: UIKit app experiments
        working-directory: ios-spike
        run: ./app_tests.sh
      - name: idb (optional)
        working-directory: ios-spike
        timeout-minutes: 15
        continue-on-error: true
        run: ./idb.sh
      - name: Shut down the simulator
        if: always()
        run: |
          [ -n "$SPIKE_UDID" ] && xcrun simctl shutdown "$SPIKE_UDID"; [ -n "$SPIKE_UDID" ] && xcrun simctl delete "$SPIKE_UDID"; true

  sdl3:
    name: sdl3 for iOS (cargo test --no-run, then spawn)
    runs-on: macos-15
    timeout-minutes: 80
    env:
      SPIKE_RUNTIME_PREFIX: "18."
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_16.4*.app 2>/dev/null | tail -1); [ -n "$x" ] && sudo xcode-select -s "$x"; xcodebuild -version
      - name: Install the Rust toolchain and iOS targets (timed)
        run: |
          s=$(date +%s)
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-ios-sim,aarch64-apple-ios
          rustup default "$RUST_TOOLCHAIN"
          echo "TIMING toolchain install $(( $(date +%s) - s ))s"
      - name: Boot a simulator in the background
        run: (cd ios-spike && ./run.py boot > "$RUNNER_TEMP/boot.log" 2>&1) &
      - name: cargo test --no-run -p sdl3 --lib --target aarch64-apple-ios-sim (timed)
        id: lib
        continue-on-error: true
        run: |
          s=$(date +%s)
          cargo test --no-run -p sdl3 --lib --target aarch64-apple-ios-sim --message-format=json-render-diagnostics > "$RUNNER_TEMP/lib.json" 2> "$RUNNER_TEMP/lib.err"; rc=$?
          echo "TIMING sdl3 lib test --no-run $(( $(date +%s) - s ))s rc=$rc"
          tail -c 20000 "$RUNNER_TEMP/lib.err"
          echo "--- error summary:"; grep -E "^error" "$RUNNER_TEMP/lib.err" | sort | uniq -c | sort -rn | head -60
          python3 -c "import json,sys
          for l in open(sys.argv[1]):
              try: m=json.loads(l)
              except Exception: continue
              if m.get('reason')=='compiler-artifact' and m.get('executable') and m['target']['name']=='sdl3': print(m['executable'])" "$RUNNER_TEMP/lib.json" > "$RUNNER_TEMP/libtest-exe.txt"
          cat "$RUNNER_TEMP/libtest-exe.txt"
          exit $rc
      - name: cargo build -p sdl3 --lib --target aarch64-apple-ios (timed)
        continue-on-error: true
        run: |
          s=$(date +%s); cargo build -p sdl3 --lib --target aarch64-apple-ios 2>&1 | tail -40; echo "TIMING sdl3 device lib $(( $(date +%s) - s ))s rc=${PIPESTATUS[0]}"
      - name: Run the sdl3 lib tests under simctl spawn
        if: steps.lib.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          U=$(ios-spike/wait_boot.sh)
          exe=$(head -1 "$RUNNER_TEMP/libtest-exe.txt")
          s=$(date +%s)
          SIMCTL_CHILD_RUST_TEST_THREADS=4 perl -e 'alarm 1500; exec @ARGV' xcrun simctl spawn "$U" "$exe" > "$RUNNER_TEMP/libtest.log" 2>&1; rc=$?
          echo "TIMING sdl3 lib tests $(( $(date +%s) - s ))s rc=$rc"
          grep -E "^test result|FAILED|panicked" "$RUNNER_TEMP/libtest.log" | head -100
          echo "--- failures section:"; sed -n '/^failures:/,$p' "$RUNNER_TEMP/libtest.log" | tail -150
          echo "--- tail:"; tail -30 "$RUNNER_TEMP/libtest.log"

  upstream:
    name: upstream C reference (CMake, iOS simulator)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SPIKE_RUNTIME_PREFIX: "18."
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: |
          x=$(ls -d /Applications/Xcode_16.4*.app 2>/dev/null | tail -1); [ -n "$x" ] && sudo xcode-select -s "$x"; xcodebuild -version
      - name: Boot a simulator (background)
        run: (cd ios-spike && ./run.py boot > "$RUNNER_TEMP/boot.log" 2>&1) &
      - name: Build and run the upstream C trace
        working-directory: ios-spike
        run: |
          ./upstream.sh
