# Throwaway diag workflow (claude/diag-fluidsynth-dls only, never merged):
# PR 0 of the FluidSynth DLS phase. Rebuilds the C reference of
# sdl3-mixer-fluidsynth's src/tests.rs (libsdl-org/fluidsynth b53de28 as
# SDL_mixer's CMake configures it, SDL's bundled libm from upstream SDL at
# ea7a2da, the IIR filter without -ffast-math, the Note (upstream) patches)
# and checks it reproduces testdata/reference.txt byte for byte; then the
# plan's probes (a)-(i) on hand-made DLS files and on FluidSynth's
# VintageDreamsWaves-v2.dls (downloaded here, pinned by checksum, never
# committed). The C and the scripts are in this file (no C file is
# committed). GCC/libstdc++ on ubuntu-latest, as the plan's D5.
name: fluidsynth-dls-diag

on:
  push:
    branches: [claude/diag-fluidsynth-dls]
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_COMMIT: ea7a2dabfd1ab6b0a5720568ffd207f5825e47f1
  FLUIDSYNTH_COMMIT: b53de2809bc5e4bffdaec59f447f81ba55ce4fe1
  VINTAGE_URL: https://raw.githubusercontent.com/FluidSynth/fluidsynth/v2.5.7/sf2/VintageDreamsWaves-v2.dls
  VINTAGE_SHA256: bcac37f123565667e2ee2aca5e5ebf5bd8e306a51f764fa3d5cb6c53cad88446

jobs:
  cref:
    name: C reference and DLS probes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          gcc --version | head -n 1; g++ --version | head -n 1; cmake --version | head -n 1
          echo "user $(id -un), ulimit -l $(ulimit -l), ulimit -v $(ulimit -v)"
          gcc -Q --help=target 2>/dev/null | grep -E "^ +-march=|^ +-mfma " || true
          echo | gcc -dM -E - | grep -E "__FMA__|__AVX2__" || echo "(no __FMA__/__AVX2__ by default)"
      - name: Write the C and the scripts
        run: |
          FSD="$RUNNER_TEMP/fsd"; mkdir -p "$FSD"
          cat > "$FSD/sdlmath.h" <<'FSD_EOF_sdlmath_h'
          /* forced include of the C reference's C files: SDL's bundled math functions
           * (src/libm, which SDL_sin() and friends call only where the C library has
           * none; sdl3's math always uses them) */
          #ifndef FSREF_SDLMATH_H
          #define FSREF_SDLMATH_H
          #ifdef __cplusplus
          #include <cmath>
          extern "C" {
          #else
          #include <math.h>
          #endif
          extern double SDL_uclibc_cos(double x);
          extern double SDL_uclibc_exp(double x);
          extern double SDL_uclibc_log(double x);
          extern double SDL_uclibc_log10(double x);
          extern double SDL_uclibc_pow(double x, double y);
          extern double SDL_uclibc_sin(double x);
          extern double SDL_uclibc_sqrt(double x);
          static inline float fsref_powf(float x, float y) { return (float)SDL_uclibc_pow(x, y); }
          static inline float fsref_sinf(float x) { return (float)SDL_uclibc_sin(x); }
          static inline float fsref_cosf(float x) { return (float)SDL_uclibc_cos(x); }
          static inline float fsref_sqrtf(float x) { return (float)SDL_uclibc_sqrt(x); }
          static inline float fsref_logf(float x) { return (float)SDL_uclibc_log(x); }
          static inline float fsref_log10f(float x) { return (float)SDL_uclibc_log10(x); }
          static inline float fsref_expf(float x) { return (float)SDL_uclibc_exp(x); }
          #ifdef __cplusplus
          }
          #else
          #define pow SDL_uclibc_pow
          #define powf fsref_powf
          #define sin SDL_uclibc_sin
          #define sinf fsref_sinf
          #define cos SDL_uclibc_cos
          #define cosf fsref_cosf
          #define sqrt SDL_uclibc_sqrt
          #define sqrtf fsref_sqrtf
          #define log SDL_uclibc_log
          #define logf fsref_logf
          #define log10 SDL_uclibc_log10
          #define log10f fsref_log10f
          #define exp SDL_uclibc_exp
          #define expf fsref_expf
          #endif
          #endif
          FSD_EOF_sdlmath_h
          cat > "$FSD/patch.sh" <<'FSD_EOF_patch_sh'
          #!/bin/bash
          # usage: patch.sh FLUIDSYNTH_DIR : the reference's patches (see the crate's src/tests.rs)
          set -euo pipefail
          F="$1"
          python3 -I - "$F" <<'PY'
          import sys
          F = sys.argv[1]
          def sub(path, old, new, count=1):
              p = F + '/' + path
              s = open(p).read()
              assert s.count(old) == count, (path, old, s.count(old))
              s = s.replace(old, new)
              open(p, 'w').write(s)
          # the IIR filter without -ffast-math
          sub('src/CMakeLists.txt',
              '  set_source_files_properties(rvoice/fluid_iir_filter_impl.cpp PROPERTIES COMPILE_FLAGS "-fno-math-errno -ffast-math")\n', '')
          # SDL's math in the one C++ file that calls the C library's (C files: the forced include)
          # (the forced include declares them in C++ too)
          sub('src/rvoice/fluid_iir_filter_impl.cpp', 'std::sin(omega)', 'fsref_sinf(omega)')
          sub('src/rvoice/fluid_iir_filter_impl.cpp', 'std::cos(omega)', 'fsref_cosf(omega)')
          sub('src/rvoice/fluid_iir_filter_impl.cpp', 'std::sqrt(q)', 'fsref_sqrtf(q)')
          # Note (upstream) of fluid_voice.c: modulator destinations past the generators
          sub('src/synth/fluid_voice.c',
              '''        int dest_gen_index = mod->dest;
                  fluid_gen_t *dest_gen = &voice->gen[dest_gen_index];
                  dest_gen->mod += modval;
          ''', '''        int dest_gen_index = mod->dest;
                  if(dest_gen_index < GEN_LAST)
                  {
                  fluid_gen_t *dest_gen = &voice->gen[dest_gen_index];
                  dest_gen->mod += modval;
                  }
          ''')
          sub('src/synth/fluid_voice.c',
              '''    unsigned int count, z;
              fluid_real_t x = fluid_voice_gen_value(voice, gen);
          ''', '''    unsigned int count, z;
              fluid_real_t x;
              if((unsigned int)gen >= GEN_LAST)
              {
                  return;
              }
              x = fluid_voice_gen_value(voice, gen);
          ''')
          sub('src/synth/fluid_voice.c',
              '''            gen = fluid_mod_get_dest(mod);
          ''', '''            gen = fluid_mod_get_dest(mod);
                      if(gen >= GEN_LAST)
                      {
                          continue;
                      }
          ''')
          # Note (upstream) of fluid_midi.c: a negative skip of a non-track chunk
          sub('src/midi/fluid_midi.c',
              '''            skip = fluid_getlength(length);
          ''', '''            skip = fluid_getlength(length);
                      if(skip < 0)
                      {
                          FLUID_LOG(FLUID_ERR, "Failed to seek position in file");
                          return FLUID_FAILED;
                      }
          ''')
          # Note (upstream) of fluid_rev.c: the parameters start at 0
          sub('src/rvoice/fluid_rev.c',
              '''    FLUID_MEMSET(&rev->late, 0,  sizeof(fluid_late));
          ''', '''    FLUID_MEMSET(rev, 0,  sizeof(*rev));
          ''')
          PY
          FSD_EOF_patch_sh
          cat > "$FSD/build.sh" <<'FSD_EOF_build_sh'
          #!/bin/bash
          # usage: build.sh OUT [extra cmake args...]: fluidsynth b53de28 patched as the reference, static
          # (-ffp-contract=off: no FMA contraction where the compiler targets x86-64-v3 by default, as
          # ubuntu-latest's GCC 15 does; the reference's GCC 13 targeted baseline x86-64, without FMA)
          set -euo pipefail
          D=$(cd "$(dirname "$0")" && pwd)
          OUT="$1"; shift
          SRC=$D/../sdlorg-fluidsynth
          rm -rf "$OUT"
          mkdir -p "$OUT"
          (cd "$SRC" && git archive --format=tar HEAD) | tar -x -C "$OUT" --one-top-level=src-fs
          "$D/patch.sh" "$OUT/src-fs"
          OFF="enable-alsa enable-aufile enable-dbus enable-ipv6 enable-jack enable-ladspa
            enable-libinstpatch enable-libsndfile enable-midishare enable-opensles enable-oboe enable-network
            enable-oss enable-dsound enable-wasapi enable-waveout enable-winmidi enable-sdl3 enable-pulseaudio
            enable-pipewire enable-readline enable-threads enable-openmp enable-unicode enable-native enable-signalsmith
            enable-framework enable-systemd enable-coreaudio enable-coremidi enable-dart enable-kai"
          ARGS=()
          for o in $OFF; do ARGS+=("-D$o=OFF"); done
          cmake -S "$OUT/src-fs" -B "$OUT/b" -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE:-Release} -Dosal=cpp11 -DBUILD_SHARED_LIBS=OFF \
            "-DCMAKE_C_FLAGS=-include $D/sdlmath.h -ffp-contract=off ${EXTRA_CFLAGS:-}" \
            "-DCMAKE_CXX_FLAGS=-include $D/sdlmath.h -ffp-contract=off ${EXTRA_CXXFLAGS:-}" "${ARGS[@]}" "$@" > "$OUT/cmake.log" 2>&1 || { tail -n 40 "$OUT/cmake.log"; exit 1; }
          cmake --build "$OUT/b" --target libfluidsynth > "$OUT/build.log" 2>&1 || { tail -n 60 "$OUT/build.log"; exit 1; }
          find "$OUT/b" -name 'libfluidsynth*.a'
          FSD_EOF_build_sh
          cat > "$FSD/fsref.c" <<'FSD_EOF_fsref_c'
          /* The C reference of sdl3-mixer-fluidsynth's src/tests.rs (rebuilt from
           * its description): each cases.txt line as SDL_mixer's FluidSynth decoder
           * runs it, over a memory SoundFont loader. Diag only, never committed. */
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <fluidsynth.h>
          
          #ifdef FSREF_DLS
          /* private (src/sfloader/fluid_dls.h) */
          fluid_sfloader_t *new_fluid_dls_loader(fluid_synth_t *synth, fluid_settings_t *settings);
          #endif
          
          static void log_fn(int level, const char *message, void *data)
          {
              (void)data;
              printf("  log%d ", level);
              int ascii = 1;
              for (const unsigned char *p = (const unsigned char *)message; *p; p++) {
                  if (*p < 0x80) {
                      putchar(*p);
                      ascii = 1;
                  } else if (ascii) {
                      putchar('?');
                      ascii = 0;
                  }
              }
              putchar('\n');
          }
          
          typedef struct {
              const unsigned char *data;
              long long len;
              long long pos;
          } memfile;
          
          static const unsigned char *g_sf;
          static long long g_sflen;
          
          static void *mf_open(const char *filename)
          {
              if (strcmp(filename, "&FAKESFNAME&") != 0) {
                  return NULL;
              }
              memfile *m = calloc(1, sizeof(*m));
              m->data = g_sf;
              m->len = g_sflen;
              return m;
          }
          
          static int mf_read(void *buf, fluid_long_long_t count, void *handle)
          {
              memfile *m = handle;
              if (count > 0xFFFFFFFFLL || count < 0) {
                  return FLUID_FAILED;
              }
              long long avail = m->len - m->pos;
              long long n = count < avail ? count : avail;
              if (n < 0) {
                  n = 0;
              }
              if (n > 0) {
                  memcpy(buf, m->data + m->pos, (size_t)n);
              }
              m->pos += n;
              return n == count ? FLUID_OK : FLUID_FAILED;
          }
          
          static int mf_seek(void *handle, fluid_long_long_t offset, int origin)
          {
              memfile *m = handle;
              long long base;
              switch (origin) {
              case SEEK_SET: base = 0; break;
              case SEEK_CUR: base = m->pos; break;
              case SEEK_END: base = m->len; break;
              default: return FLUID_FAILED;
              }
              long long pos = (long long)((unsigned long long)base + (unsigned long long)offset);
              if (pos < 0) {
                  return FLUID_FAILED;
              }
              m->pos = pos < m->len ? pos : m->len;
              return FLUID_OK;
          }
          
          static fluid_long_long_t mf_tell(void *handle)
          {
              return ((memfile *)handle)->pos;
          }
          
          static int mf_close(void *handle)
          {
              free(handle);
              return FLUID_OK;
          }
          
          static const char *g_dir;
          
          static unsigned char *slurp(const char *name, long long *len)
          {
              char path[4096];
              snprintf(path, sizeof(path), "%s/%s", g_dir, name);
              FILE *f = fopen(path, "rb");
              if (!f) {
                  return NULL;
              }
              fseek(f, 0, SEEK_END);
              long n = ftell(f);
              fseek(f, 0, SEEK_SET);
              unsigned char *buf = malloc(n ? n : 1);
              if (fread(buf, 1, n, f) != (size_t)n) {
                  n = 0;
              }
              fclose(f);
              *len = n;
              return buf;
          }
          
          static uint64_t fnv(uint64_t h, const unsigned char *d, size_t n)
          {
              for (size_t i = 0; i < n; i++) {
                  h ^= d[i];
                  h *= 1099511628211ULL;
              }
              return h;
          }
          
          static void apply_setting(fluid_settings_t *settings, const char *kv)
          {
              char k[256];
              const char *eq = strchr(kv, '=');
              if (!eq || (size_t)(eq - kv) >= sizeof(k)) {
                  return;
              }
              memcpy(k, kv, eq - kv);
              k[eq - kv] = 0;
              const char *v = eq + 1;
              switch (fluid_settings_get_type(settings, k)) {
              case FLUID_NUM_TYPE: fluid_settings_setnum(settings, k, atof(v)); break;
              case FLUID_INT_TYPE: fluid_settings_setint(settings, k, atoi(v)); break;
              case FLUID_STR_TYPE: fluid_settings_setstr(settings, k, v); break;
              default: break;
              }
          }
          
          static void run_case(char *line)
          {
              char *tok[64];
              int ntok = 0;
              for (char *t = strtok(line, " \t\r\n"); t && ntok < 64; t = strtok(NULL, " \t\r\n")) {
                  tok[ntok++] = t;
              }
              if (ntok < 5) {
                  return;
              }
              int rate = atoi(tok[3]);
              long long maxframes = atoll(tok[4]);
              unsigned char *sf = NULL;
              long long sflen = 0;
              int dls = 0;
              const char *sfname = tok[1];
              if (strncmp(sfname, "dls:", 4) == 0) {
                  dls = 1;
                  sfname += 4;
              }
              if (strcmp(sfname, "-") != 0) {
                  sf = slurp(sfname, &sflen);
              }
              long long midlen = 0;
              unsigned char *mid = slurp(tok[2], &midlen);
          
              fluid_settings_t *settings = new_fluid_settings();
              double sr = 0;
              fluid_settings_setnum(settings, "synth.gain", 1.0);
              fluid_settings_setnum(settings, "synth.sample-rate", (double)rate);
              fluid_settings_getnum(settings, "synth.sample-rate", &sr);
              fluid_settings_setnum(settings, "synth.chorus.depth", 5.0);
              fluid_settings_setnum(settings, "synth.chorus.level", 0.35);
              fluid_settings_setnum(settings, "synth.reverb.damp", 0.4);
              fluid_settings_setnum(settings, "synth.reverb.level", 0.15);
              fluid_settings_setnum(settings, "synth.reverb.width", 4);
              fluid_settings_setnum(settings, "synth.reverb.room-size", 0.6);
              for (int i = 5; i < ntok; i++) {
                  apply_setting(settings, tok[i]);
              }
              fluid_synth_t *synth = new_fluid_synth(settings);
              if (!synth) {
                  printf("%s synth=fail\n", tok[0]);
                  delete_fluid_settings(settings);
                  free(sf);
                  free(mid);
                  return;
              }
              int sfid = -2;
              if (sf) {
                  fluid_sfloader_t *loader;
          #ifdef FSREF_DLS
                  if (dls) {
                      loader = new_fluid_dls_loader(synth, settings);
                  } else
          #endif
                  {
                      loader = new_fluid_defsfloader(settings);
                  }
                  g_sf = sf;
                  g_sflen = sflen;
                  fluid_sfloader_set_callbacks(loader, mf_open, mf_read, mf_seek, mf_tell, mf_close);
                  fluid_synth_add_sfloader(synth, loader);
                  sfid = fluid_synth_sfload(synth, "&FAKESFNAME&", 1);
              }
              fluid_player_t *player = new_fluid_player(synth);
              if (!player) {
                  printf("%s sf=%d player=fail\n", tok[0], sfid);
                  delete_fluid_synth(synth);
                  delete_fluid_settings(settings);
                  free(sf);
                  free(mid);
                  return;
              }
              static const unsigned char empty[1];
              int add = fluid_player_add_mem(player, mid ? (const void *)mid : (const void *)empty, mid ? (size_t)midlen : 0);
              int play = fluid_player_play(player);
              long long frames = 0;
              uint64_t h = 14695981039346656037ULL;
              float samples[256];
              int trace = getenv("FSREF_TRACE") != NULL;
              while (frames < maxframes && fluid_player_get_status(player) == FLUID_PLAYER_PLAYING) {
                  if (fluid_synth_write_float(synth, 128, samples, 0, 2, samples, 1, 2) != FLUID_OK) {
                      break;
                  }
                  h = fnv(h, (const unsigned char *)samples, sizeof(samples));
                  if (getenv("FSREF_RAW")) {
                      FILE *rf = fopen(getenv("FSREF_RAW"), "ab");
                      fwrite(samples, 1, sizeof(samples), rf);
                      fclose(rf);
                  }
                  frames += 128;
                  if (trace && frames % 4096 == 0) {
                      fprintf(stderr, "%s %lld %016llx\n", tok[0], frames, (unsigned long long)h);
                  }
              }
              printf("%s sf=%d add=%d play=%d frames=%lld status=%d ticks=%d total=%d voices=%d hash=%016llx\n",
                     tok[0], sfid, add, play, frames, fluid_player_get_status(player),
                     fluid_player_get_current_tick(player), fluid_player_get_total_ticks(player),
                     fluid_synth_get_active_voice_count(synth), (unsigned long long)h);
              fluid_player_stop(player);
              delete_fluid_player(player);
              delete_fluid_synth(synth);
              delete_fluid_settings(settings);
              free(sf);
              free(mid);
          }
          
          int main(int argc, char **argv)
          {
              if (argc < 3) {
                  fprintf(stderr, "usage: fsref CASES DIR\n");
                  return 2;
              }
              setvbuf(stdout, NULL, _IOFBF, 1 << 16);
              g_dir = argv[2];
              for (int level = 0; level < LAST_LOG_LEVEL; level++) {
                  fluid_set_log_function(level, level == FLUID_DBG ? NULL : log_fn, NULL);
              }
              FILE *f = fopen(argv[1], "r");
              if (!f) {
                  return 2;
              }
              char line[8192];
              while (fgets(line, sizeof(line), f)) {
                  if (line[0] == '#' || line[0] == '\n' || line[0] == 0) {
                      continue;
                  }
                  run_case(line);
              }
              fclose(f);
              fflush(stdout);
              return 0;
          }
          FSD_EOF_fsref_c
          cat > "$FSD/fsprobe.c" <<'FSD_EOF_fsprobe_c'
          /* PR 0 probes of FluidSynth's DLS loader (diag only, never committed).
           * usage: fsprobe FILE RATE BANKSTYLE mem|path [KEY...]
           * Loads FILE through the private DLS loader over memory (mem) or through
           * the synth's own loaders by path (path), prints the log, the sfload
           * result and the preset list, then for each KEY a noteon on channel 0
           * (and 9) and the voices it started (key, sample, root key). */
          #include "fluid_synth.h"
          #include "fluid_voice.h"
          #include "fluid_sfont.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          
          fluid_sfloader_t *new_fluid_dls_loader(fluid_synth_t *synth, fluid_settings_t *settings);
          
          static void log_fn(int level, const char *message, void *data)
          {
              (void)data;
              printf("  log%d %s\n", level, message);
          }
          
          typedef struct { const unsigned char *data; long long len, pos; } memfile;
          static unsigned char *g_sf;
          static long long g_sflen;
          
          static void *mf_open(const char *filename)
          {
              if (strcmp(filename, "&FAKESFNAME&") != 0) return NULL;
              memfile *m = calloc(1, sizeof(*m));
              m->data = g_sf; m->len = g_sflen;
              return m;
          }
          static int mf_read(void *buf, fluid_long_long_t count, void *handle)
          {
              memfile *m = handle;
              if (count > 0xFFFFFFFFLL || count < 0) return FLUID_FAILED;
              long long avail = m->len - m->pos, n = count < avail ? count : avail;
              if (n < 0) n = 0;
              if (n > 0) memcpy(buf, m->data + m->pos, (size_t)n);
              m->pos += n;
              return n == count ? FLUID_OK : FLUID_FAILED;
          }
          static int mf_seek(void *handle, fluid_long_long_t offset, int origin)
          {
              memfile *m = handle;
              long long base = origin == SEEK_SET ? 0 : origin == SEEK_CUR ? m->pos : origin == SEEK_END ? m->len : -1;
              if (base < 0) return FLUID_FAILED;
              long long pos = (long long)((unsigned long long)base + (unsigned long long)offset);
              if (pos < 0) return FLUID_FAILED;
              m->pos = pos < m->len ? pos : m->len;
              return FLUID_OK;
          }
          static fluid_long_long_t mf_tell(void *handle) { return ((memfile *)handle)->pos; }
          static int mf_close(void *handle) { free(handle); return FLUID_OK; }
          
          static void voices(fluid_synth_t *synth, int chan, int key)
          {
              fluid_voice_t *list[64];
              fluid_synth_all_sounds_off(synth, -1);
              fluid_synth_write_float(synth, 64, (float[128]){0}, 0, 2, (float[128]){0}, 1, 2);
              int r = fluid_synth_noteon(synth, chan, key, 100);
              fluid_synth_get_voicelist(synth, list, 64, -1);
              printf("noteon chan=%d key=%d -> %d\n", chan, key, r);
              for (int i = 0; i < 64 && list[i]; i++) {
                  fluid_voice_t *v = list[i];
                  printf("  voice key=%d sample='%s' origpitch=%d pitchadj=%d overriderootkey=%g scaletune=%g samplemode=%g attenuation=%g\n",
                         fluid_voice_get_key(v), v->sample ? v->sample->name : "(null)",
                         v->sample ? v->sample->origpitch : -1, v->sample ? v->sample->pitchadj : -1,
                         fluid_voice_gen_get(v, GEN_OVERRIDEROOTKEY), fluid_voice_gen_get(v, GEN_SCALETUNE),
                         fluid_voice_gen_get(v, GEN_SAMPLEMODE), fluid_voice_gen_get(v, GEN_ATTENUATION));
              }
          }
          
          int main(int argc, char **argv)
          {
              if (argc < 5) return 2;
              setvbuf(stdout, NULL, _IONBF, 0);
              for (int level = 0; level < LAST_LOG_LEVEL; level++)
                  fluid_set_log_function(level, level == FLUID_DBG && !getenv("FSPROBE_DBG") ? NULL : log_fn, NULL);
              fluid_settings_t *settings = new_fluid_settings();
              fluid_settings_setnum(settings, "synth.sample-rate", atof(argv[2]));
              fluid_settings_setstr(settings, "synth.midi-bank-select", argv[3]);
              fluid_synth_t *synth = new_fluid_synth(settings);
              int sfid;
              if (strcmp(argv[4], "mem") == 0) {
                  FILE *f = fopen(argv[1], "rb");
                  if (!f) return 2;
                  fseek(f, 0, SEEK_END); g_sflen = ftell(f); fseek(f, 0, SEEK_SET);
                  g_sf = malloc(g_sflen + 1);
                  if (fread(g_sf, 1, g_sflen, f) != (size_t)g_sflen) return 2;
                  fclose(f);
                  fluid_sfloader_t *loader = new_fluid_dls_loader(synth, settings);
                  fluid_sfloader_set_callbacks(loader, mf_open, mf_read, mf_seek, mf_tell, mf_close);
                  fluid_synth_add_sfloader(synth, loader);
                  sfid = fluid_synth_sfload(synth, "&FAKESFNAME&", 1);
              } else {
                  sfid = fluid_synth_sfload(synth, argv[1], 1);
              }
              printf("sfload=%d\n", sfid);
              fluid_sfont_t *sf = sfid >= 0 ? fluid_synth_get_sfont_by_id(synth, sfid) : NULL;
              if (sf) {
                  fluid_preset_t *p;
                  fluid_sfont_iteration_start(sf);
                  while ((p = fluid_sfont_iteration_next(sf)) != NULL)
                      printf("  preset %d:%d '%s'\n", fluid_preset_get_banknum(p), fluid_preset_get_num(p), fluid_preset_get_name(p));
                  for (int i = 5; i < argc; i++) {
                      voices(synth, 0, atoi(argv[i]));
                      voices(synth, 9, atoi(argv[i]));
                  }
              }
              delete_fluid_synth(synth);
              delete_fluid_settings(settings);
              free(g_sf);
              return 0;
          }
          FSD_EOF_fsprobe_c
          cat > "$FSD/compile.sh" <<'FSD_EOF_compile_sh'
          #!/bin/bash
          # usage: compile.sh D : the harness binaries over D/fs1 (plain) and D/fs2 (ASan)
          set -euo pipefail
          D="$1"; cd "$D"
          for v in 1 2; do
            B=fs$v; F=$B/src-fs/src
            INC="-I $B/b -I $B/b/include -I $B/src-fs/include -I $F -I $F/utils -I $F/synth -I $F/sfloader -I $F/rvoice -I $F/midi -I $F/bindings -I $F/drivers"
            X="-ffp-contract=off"; [ $v = 2 ] && X="-ffp-contract=off -fsanitize=address -fno-omit-frame-pointer -g"
            LIBS="$B/b/src/libfluidsynth.a sdl/lib/libSDL3.a -lstdc++ -lm -lpthread -ldl"
            N=""; [ $v = 2 ] && N="_asan"
            gcc -O2 $X -I $B/src-fs/include -I $B/b/include fsref.c $LIBS -o fsref$N
            gcc -O2 $X -DFSREF_DLS -I $B/src-fs/include -I $B/b/include fsref.c $LIBS -o fsref_dls$N
            gcc -O1 $X -include "$D/sdlmath.h" $INC fsprobe.c $LIBS -o fsprobe$N 2>&1 | grep -v "warning\|note:\|^ \|^In file" || true
          done
          ls -la fsref fsref_dls fsprobe fsref_asan fsref_dls_asan fsprobe_asan
          FSD_EOF_compile_sh
          cat > "$FSD/gendls.sh" <<'FSD_EOF_gendls_sh'
          #!/bin/bash
          # usage: gendls.sh OUTDIR : the PR 0 probe DLS files (diag only; hand-made from the DLS layout)
          set -euo pipefail
          mkdir -p "$1"
          python3 -I - "$1" <<'PY'
          import struct, sys, os
          out = sys.argv[1]
          
          def ck(fcc, data):
              b = fcc.encode('latin-1') + struct.pack('<I', len(data)) + data
              if len(data) % 2:
                  b += b'\0'
              return b
          
          def lst(fcc, *subs, kind='LIST'):
              data = fcc.encode('latin-1') + b''.join(subs)
              return kind.encode() + struct.pack('<I', len(data)) + data
          
          def info(name):
              return lst('INFO', ck('INAM', name.encode() + b'\0'))
          
          def fmt(rate=22050, bits=16, ch=1, tag=1):
              ba = ch * bits // 8
              return ck('fmt ', struct.pack('<HHIIHH', tag, ch, rate, rate * ba, ba, bits))
          
          def wsmp(unity=60, fine=0, gain=0, loop=None):
              d = struct.pack('<IHhiII', 20, unity, fine, gain, 0, 1 if loop else 0)
              if loop:
                  d += struct.pack('<IIII', 16, loop[0], loop[1], loop[2])
              return ck('wsmp', d)
          
          def wave16(n, period, name, ws=True, loop=True):
              s = []
              for i in range(n):
                  ph = i % period
                  s.append(int(12000 * (1 - 4 * abs(ph / period - 0.5))))
              data = struct.pack('<%dh' % n, *s)
              subs = [fmt()]
              if ws:
                  subs.append(wsmp(60, 0, 0, (0, 8, n - 16) if loop else None))
              subs += [ck('data', data), info(name)]
              return lst('wave', *subs)
          
          def wave8(n, period, name, ws=False):
              data = bytes(128 + (60 if (i % period) < period // 2 else -60) for i in range(n))
              subs = [fmt(bits=8)]
              if ws:
                  subs.append(wsmp(60))
              subs += [ck('data', data), info(name)]
              return lst('wave', *subs)
          
          def wvpl_ptbl(waves):
              offs, pos = [], 0
              for w in waves:
                  offs.append(pos)
                  pos += len(w)
              ptbl = ck('ptbl', struct.pack('<II', 8, len(waves)) + b''.join(struct.pack('<I', o) for o in offs))
              return ptbl, lst('wvpl', *waves)
          
          def conn(src, ctl, dst, trn, scale):
              return struct.pack('<HHHHi', src, ctl, dst, trn, scale)
          
          def art1(*blocks):
              return ck('art1', struct.pack('<II', 8, len(blocks)) + b''.join(blocks))
          
          def lart(*subs):
              return lst('lart', *subs)
          
          def cdl(*ops):
              return ck('cdl ', b''.join(ops))
          
          def CONST(v):
              return struct.pack('<HI', 0x10, v & 0xFFFFFFFF)
          
          def OP(code):
              return struct.pack('<H', code)
          
          GUID_RATE = struct.pack('<IHH8B', 0x2a91f713, 0xa4bf, 0x11d2, 0xbb, 0xdf, 0x0, 0x60, 0x8, 0x33, 0xdb, 0xd8)
          GUID_GM = struct.pack('<IHH8B', 0x178f2f24, 0xc364, 0x11d1, 0xa7, 0x60, 0x00, 0x00, 0xf8, 0x75, 0xac, 0x12)
          
          def QUERY(g):
              return struct.pack('<H', 0x11) + g
          
          def QSUP(g):
              return struct.pack('<H', 0x12) + g
          
          def rgn(keylo=0, keyhi=127, sample=0, extra=(), wl=True, group=0):
              subs = [ck('rgnh', struct.pack('<HHHHHH', keylo, keyhi, 0, 127, 0, group))]
              subs += list(extra)
              if wl:
                  subs.append(ck('wlnk', struct.pack('<HHII', 0, 0, 1, sample)))
              return lst('rgn ', *subs)
          
          def ins(name, bank=0, prog=0, regions=(), larts=(), drums=False, before=()):
              b = bank | (0x80000000 if drums else 0)
              return lst('ins ', ck('insh', struct.pack('<III', len(regions), b, prog)), *before,
                         lst('lrgn', *regions), *larts, info(name))
          
          def dls(instruments, waves, top=(), colh=None, name='probe'):
              ptbl, wvpl = wvpl_ptbl(waves)
              n = len(instruments) if colh is None else colh
              body = [ck('colh', struct.pack('<I', n)), ck('vers', struct.pack('<II', 0x00010000, 0))]
              body += list(top)
              body += [lst('lins', *instruments), ptbl, wvpl, info(name)]
              return lst('DLS ', *body, kind='RIFF')
          
          def save(name, data):
              with open(os.path.join(out, name), 'wb') as f:
                  f.write(data)
          
          W = [wave16(256, 64, 'tri64'), wave8(200, 40, 'sq40')]
          # a plain bank: a melodic instrument (looped 16-bit sample, art1 with a few blocks) and a drum kit
          melodic = ins('Lead', 0, 0, [rgn(0, 63, 0), rgn(64, 127, 1)],
                        [lart(art1(conn(0x0001, 0, 0x0003, 0, 50 << 16),            # LFO -> pitch
                                   conn(0, 0, 0x0104, 0, -851 << 16),               # LFO frequency
                                   conn(0x0002, 0, 0x0001, 1, -96 << 16)))])        # vel -> gain (concave)
          drums = ins('Kit', 0, 0, [rgn(35, 81, 1)], drums=True)
          save('ok.dls', dls([melodic, drums], W))
          
          # U1: an articulation whose cdl is false fails the whole file (instrument level, region level),
          # while a region's own false cdl only drops the region
          save('u1_ins.dls', dls([ins('U1i', 0, 0, [rgn()], [lart(cdl(CONST(0)), art1(conn(0, 0, 0x0003, 0, 100 << 16)))])], W))
          save('u1_rgn.dls', dls([ins('U1r', 0, 0, [rgn(extra=[lart(cdl(CONST(0)), art1(conn(0, 0, 0x0003, 0, 100 << 16)))])])], W))
          save('u1_ctl.dls', dls([ins('U1c', 0, 0, [rgn(0, 63, extra=[cdl(CONST(0))]), rgn(64, 127, 1)])], W))
          # U2: QUERY also pushes the "supported" flag
          save('u2_eq.dls', dls([melodic], W, top=[cdl(QUERY(GUID_RATE), CONST(44100), OP(0x0E))]))
          save('u2_eq48.dls', dls([melodic], W, top=[cdl(QUERY(GUID_RATE), CONST(48000), OP(0x0E))]))
          save('u2_sup.dls', dls([melodic], W, top=[cdl(QSUP(GUID_RATE))]))
          # (0 AND GMInHardware: false by the specification, true here)
          save('u2_and.dls', dls([melodic], W, top=[cdl(CONST(0), QUERY(GUID_GM), OP(0x01))]))
          # U3: the Key Number generator (x0.5) in one instrument lart, then in the first of two
          KEYHALF = conn(0x0003, 0, 0x0005, 0, 6400 * 65536)
          two = [rgn(0, 40, 0), rgn(41, 127, 1)]
          save('u3_one.dls', dls([ins('U3a', 0, 0, two, [lart(art1(KEYHALF))])], W))
          save('u3_two.dls', dls([ins('U3b', 0, 0, two, [lart(art1(KEYHALF)), lart(art1(conn(0, 0, 0x0003, 0, 0)))])], W))
          save('u3_rgn.dls', dls([ins('U3r', 0, 0, [rgn(extra=[lart(art1(KEYHALF)), lart(art1(conn(0, 0, 0x0003, 0, 0)))])])], W))
          # U11: a sample without wsmp, a region without wsmp
          save('u11.dls', dls([ins('U11', 0, 0, [rgn(0, 127, 1)])], W))
          save('u11_ws.dls', dls([ins('U11w', 0, 0, [rgn(0, 127, 1, extra=[wsmp(60)])])], W))
          # what(): a region without wlnk over a ptbl without cues (vector::at), colh 0xFFFFFFFF (bad_alloc)
          save('at.dls', dls([ins('At', 0, 0, [rgn(wl=False)])], []))
          save('colh_huge.dls', dls([melodic], W, colh=0xFFFFFFFF))
          # sort ties: N instruments all at bank 0 program 0, named by file order
          for n in (16, 17, 20, 40):
              save('tie%d.dls' % n, dls([ins('T%02d' % i, 0, 0, [rgn()]) for i in range(n)], W))
          # 40 instruments over 3 bank MSBs, programs descending (no ties)
          save('mix40.dls', dls([ins('M%02d' % i, (i % 3) << 8, (39 - i) // 2, [rgn()]) for i in range(40)], W))
          # U6: a ptbl claiming 0x3FFFFFF0 cues (poolcues.resize: 4 GiB zero-filled) in a 40-byte file
          p = struct.pack('<II', 8, 0x3FFFFFF0)
          body = b'DLS ' + ck('colh', struct.pack('<I', 1)) + b'ptbl' + struct.pack('<I', 0x3FFFFFF0 * 4 + 8) + p
          save('u6_cues.dls', b'RIFF' + struct.pack('<I', len(body)) + body)
          PY
          ls -la "$1"
          FSD_EOF_gendls_sh
          cat > "$FSD/probes.sh" <<'FSD_EOF_probes_sh'
          #!/bin/bash
          # usage: probes.sh D TESTDATA VINTAGE_DLS_OR_EMPTY
          #   D: the directory with fsref_dls, fsprobe, fsprobe_asan, fsref_asan, dlsp/, fs1/ (the build)
          set -uo pipefail
          D="$1"; T="$2"; V="${3:-}"
          cd "$D"
          P=$D/pdata
          rm -rf "$P"; mkdir -p "$P/midi"
          cp "$T"/midi/*.mid "$P/midi/"; cp "$T"/*.sf2 "$P/"; cp dlsp/*.dls "$P/"
          [ -n "$V" ] && cp "$V" "$P/vintage.dls"
          
          echo "=== (a) new_fluid_dls_loader in the static library"
          nm fs1/b/src/libfluidsynth.a 2>/dev/null | grep -E " (T|t) new_fluid_dls_loader" || true
          readelf -sW fs1/b/src/CMakeFiles/libfluidsynth-OBJ.dir/sfloader/fluid_dls.cpp.o | grep -E "new_fluid_dls_loader" || true
          
          echo "=== (b) DLS data through SDL_mixer's path (the SF2 memory loader, then the synth's loaders)"
          cat > "$D/cases_b.txt" <<'EOF'
          sdlpath_ok ok.dls midi/basic.mid 44100 4096
          sdlpath_vintage vintage.dls midi/basic.mid 44100 4096
          dlsmem_ok dls:ok.dls midi/basic.mid 44100 400000
          dlsmem_ok48 dls:ok.dls midi/basic.mid 48000 400000
          dlsmem_sf2 dls:test.sf2 midi/basic.mid 44100 4096
          EOF
          ./fsref_dls "$D/cases_b.txt" "$P"
          
          echo "=== (c) VintageDreamsWaves-v2.dls"
          if [ -n "$V" ]; then
            sha256sum "$P/vintage.dls"
            ./fsprobe "$P/vintage.dls" 44100 gs path 60 | head -n 400
            for bs in gm xg mma; do echo "--- bank style $bs (memory loader)"; ./fsprobe "$P/vintage.dls" 44100 $bs mem | grep -c preset; done
            cat > "$D/cases_c.txt" <<'EOF'
          vintage dls:vintage.dls midi/basic.mid 44100 400000
          vintage48 dls:vintage.dls midi/basic.mid 48000 400000
          vintage_many dls:vintage.dls midi/many.mid 44100 400000
          vintage_mma dls:vintage.dls midi/nrpn.mid 44100 400000 synth.midi-bank-select=mma
          EOF
            ./fsref_dls "$D/cases_c.txt" "$P"
          else
            echo "(no file)"
          fi
          
          echo "=== (d) libstdc++'s what() strings"
          cat > "$D/what.cpp" <<'EOF'
          #include <cstdio>
          #include <exception>
          #include <new>
          #include <stdexcept>
          #include <vector>
          int main()
          {
              std::printf("bad_alloc: %s\n", std::bad_alloc{}.what());
              std::printf("exception: %s\n", std::exception{}.what());
              std::vector<int> v;
              try { (void)v.at(0); } catch (const std::exception &e) { std::printf("at: %s\n", e.what()); }
              std::vector<int> w(3);
              try { (void)w.at(7); } catch (const std::exception &e) { std::printf("at: %s\n", e.what()); }
              try { std::vector<long long> x; x.reserve(x.max_size() + 1); } catch (const std::exception &e) { std::printf("reserve: %s\n", e.what()); }
              std::printf("runtime_error: %s\n", std::runtime_error{"x"}.what());
              return 0;
          }
          EOF
          g++ -std=c++17 -O1 -o "$D/what" "$D/what.cpp" && "$D/what"
          for f in at colh_huge u1_ins; do echo "--- $f.dls"; ./fsprobe "$P/$f.dls" 44100 gs mem; done
          
          echo "=== (e) U1, U2, U3, U11"
          for f in u1_ins u1_rgn u1_ctl; do echo "--- $f.dls"; ./fsprobe "$P/$f.dls" 44100 gs mem 30 70; done
          for f in u2_eq u2_eq48 u2_sup u2_and; do for r in 44100 48000; do echo "--- $f.dls at $r"; ./fsprobe "$P/$f.dls" $r gs mem; done; done
          for f in u3_one u3_two u3_rgn; do echo "--- $f.dls"; ./fsprobe "$P/$f.dls" 44100 gs mem 60; done
          for f in u11 u11_ws; do echo "--- $f.dls"; ./fsprobe "$P/$f.dls" 44100 gs mem 60; done
          
          echo "=== (f) sort ties"
          for f in tie16 tie17 tie20 tie40 mix40; do echo "--- $f.dls"; ./fsprobe "$P/$f.dls" 44100 gs mem | tr '\n' ' '; echo; done
          
          echo "=== (g) mlock vs ulimit -l (user $(id -un))"
          echo "ulimit -l: $(ulimit -l)"
          ./fsprobe "$P/ok.dls" 44100 gs mem
          ( ulimit -l 0 && echo "ulimit -l: $(ulimit -l)" && ./fsprobe "$P/ok.dls" 44100 gs mem )
          ( ulimit -l 0 && echo "ulimit -l: $(ulimit -l), synth.lock-memory=0 is not settable here; path load:" && ./fsprobe "$P/ok.dls" 44100 gs path )
          if [ -n "$V" ]; then ( ulimit -l 64 && echo "ulimit -l: $(ulimit -l) (vintage)" && ./fsprobe "$P/vintage.dls" 44100 gs mem | grep -v preset ); fi
          
          echo "=== (h) ASan"
          export ASAN_OPTIONS=allocator_may_return_null=1:detect_leaks=1:abort_on_error=0
          ./fsref_asan "$T/cases.txt" "$T" > "$D/asan_ref.txt" 2> "$D/asan_ref.err"; echo "fsref_asan exit $?"
          cmp "$D/asan_ref.txt" "$T/reference.txt" && echo "fsref_asan: reference.txt identical"
          grep -c "ERROR: AddressSanitizer\|ERROR: LeakSanitizer" "$D/asan_ref.err" || true
          for f in "$P"/*.dls; do
            case "$(basename "$f")" in colh_huge.dls|u6_cues.dls) continue;; esac
            for mode in mem path; do
              ./fsprobe_asan "$f" 44100 gs $mode 60 36 > "$D/asan.out" 2> "$D/asan.err"; rc=$?
              n=$(grep -c "ERROR: AddressSanitizer\|ERROR: LeakSanitizer" "$D/asan.err" || true)
              ./fsprobe "$f" 44100 gs $mode 60 36 > "$D/plain.out" 2>&1
              same=no; cmp -s "$D/asan.out" "$D/plain.out" && same=yes
              echo "$(basename "$f") $mode exit=$rc asan_errors=$n same_output_as_plain=$same"
              [ "$n" != "0" ] && head -n 30 "$D/asan.err"
            done
          done
          ./fsref_dls_asan "$D/cases_b.txt" "$P" > "$D/asan_b.txt" 2> "$D/asan_b.err"; echo "fsref_dls_asan (b) exit $?"
          grep -c "ERROR: AddressSanitizer\|ERROR: LeakSanitizer" "$D/asan_b.err" || true
          cmp <(./fsref_dls "$D/cases_b.txt" "$P") "$D/asan_b.txt" && echo "(b) same under ASan"
          if [ -n "$V" ]; then
            ./fsref_dls_asan "$D/cases_c.txt" "$P" > "$D/asan_c.txt" 2> "$D/asan_c.err"; echo "fsref_dls_asan (c) exit $?"
            grep -c "ERROR: AddressSanitizer\|ERROR: LeakSanitizer" "$D/asan_c.err" || true
            cmp <(./fsref_dls "$D/cases_c.txt" "$P") "$D/asan_c.txt" && echo "(c) same under ASan"
          fi
          echo "--- colh_huge.dls under ASan (operator new cannot throw there)"
          ./fsprobe_asan "$P/colh_huge.dls" 44100 gs mem > /dev/null 2> "$D/asan.err"; echo "exit $?"; grep -m1 "ERROR: AddressSanitizer" "$D/asan.err" || true
          unset ASAN_OPTIONS
          echo "--- U6 and bad_alloc without ASan: colh_huge.dls, then u6_cues.dls under ulimit -v 2000000"
          ./fsprobe "$P/colh_huge.dls" 44100 gs mem | grep -v FAKESFNAME
          ( ulimit -v 2000000 && ./fsprobe "$P/u6_cues.dls" 44100 gs mem | grep -v FAKESFNAME )
          echo "--- u6_cues.dls under ulimit -v 6000000 (the 4 GiB resize succeeds, then the read fails)"
          ( ulimit -v 6000000 && TIMEFORMAT="%R s" && time ( ./fsprobe "$P/u6_cues.dls" 44100 gs mem | grep -v FAKESFNAME ) )
          
          echo "=== (i) the forced include and <cmath> in fluid_dls.cpp"
          grep -c "sdlmath.h" fs1/b/build.ninja || true
          grep -o "fluid_dls.cpp.o: CXX_COMPILER[^|]*" fs1/b/build.ninja | head -n 1
          cat > "$D/macros_only.h" <<'EOF'
          #include <math.h>
          #define pow SDL_uclibc_pow
          #define sin SDL_uclibc_sin
          #define cos SDL_uclibc_cos
          #define sqrt SDL_uclibc_sqrt
          #define log SDL_uclibc_log
          #define log10 SDL_uclibc_log10
          #define exp SDL_uclibc_exp
          EOF
          F=fs1/src-fs/src
          INC="-I fs1/b -I fs1/b/include -I fs1/src-fs/include -I $F -I $F/utils -I $F/synth -I $F/sfloader -I $F/rvoice -I $F/midi -I $F/bindings -I $F/drivers"
          echo "--- fluid_dls.cpp with the reference's header (C++ part: <cmath> and declarations, no macros)"
          g++ -std=c++17 -fsyntax-only -include "$D/sdlmath.h" $INC $F/sfloader/fluid_dls.cpp && echo ok
          echo "--- fluid_dls.cpp with the C part's macros forced in"
          g++ -std=c++17 -fsyntax-only -include "$D/macros_only.h" $INC $F/sfloader/fluid_dls.cpp > "$D/macros.err" 2>&1 && echo ok || { echo "fails: $(grep -c 'error' "$D/macros.err") errors"; grep error "$D/macros.err" | head -n 8; }
          echo "--- fluid_iir_filter_impl.cpp unpatched with the C part's macros"
          g++ -std=c++17 -fsyntax-only -include "$D/macros_only.h" $INC "$FS_SRC"/src/rvoice/fluid_iir_filter_impl.cpp > "$D/macros2.err" 2>&1 && echo ok || { echo "fails: $(grep -c 'error' "$D/macros2.err") errors"; grep error "$D/macros2.err" | head -n 4; }
          echo "=== done"
          FSD_EOF_probes_sh
          chmod +x "$FSD"/*.sh
          ls -la "$FSD"
      - name: Build upstream SDL at ea7a2da (static, console, the stdlib only)
        run: |
          FSD="$RUNNER_TEMP/fsd"
          git clone -q --filter=blob:none https://github.com/libsdl-org/SDL "$RUNNER_TEMP/sdl-src"
          git -C "$RUNNER_TEMP/sdl-src" checkout -q "$SDL_COMMIT"
          git -C "$RUNNER_TEMP/sdl-src" log --oneline -1
          cmake -S "$RUNNER_TEMP/sdl-src" -B "$RUNNER_TEMP/sdl-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_VIDEO=OFF -DSDL_RENDER=OFF -DSDL_GPU=OFF -DSDL_AUDIO=OFF \
            -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF -DSDL_SENSOR=OFF -DSDL_CAMERA=OFF -DSDL_HIDAPI=OFF \
            -DSDL_DIALOG=OFF -DSDL_POWER=OFF -DSDL_TRAY=OFF -DCMAKE_INSTALL_PREFIX="$FSD/sdl" -DCMAKE_C_FLAGS=-ffp-contract=off \
            > "$RUNNER_TEMP/sdl.cmake.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/sdl.cmake.log"; exit 1; }
          cmake --build "$RUNNER_TEMP/sdl-build" > "$RUNNER_TEMP/sdl.build.log" 2>&1 || { tail -n 60 "$RUNNER_TEMP/sdl.build.log"; exit 1; }
          cmake --install "$RUNNER_TEMP/sdl-build" > /dev/null
          nm "$FSD/sdl/lib/libSDL3.a" | grep -E " T SDL_uclibc_(pow|sin|cos|log|sqrt)$"
      - name: Build fluidsynth at b53de28 (patched as the reference; plain and ASan)
        run: |
          FSD="$RUNNER_TEMP/fsd"
          git clone -q --filter=blob:none https://github.com/libsdl-org/fluidsynth "$RUNNER_TEMP/sdlorg-fluidsynth"
          git -C "$RUNNER_TEMP/sdlorg-fluidsynth" checkout -q "$FLUIDSYNTH_COMMIT"
          git -C "$RUNNER_TEMP/sdlorg-fluidsynth" log --oneline -1
          "$FSD/build.sh" "$FSD/fs1"
          grep -E "Support for DLS files|OS abstraction" "$FSD/fs1/cmake.log" || true
          EXTRA_CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g" EXTRA_CXXFLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            "$FSD/build.sh" "$FSD/fs2"
          "$FSD/compile.sh" "$FSD"
      - name: Step 1 - reproduce testdata/reference.txt byte for byte
        run: |
          FSD="$RUNNER_TEMP/fsd"; T="$GITHUB_WORKSPACE/sdl3-mixer-fluidsynth/testdata"
          "$FSD/fsref" "$T/cases.txt" "$T" > "$FSD/out.txt"
          wc -l "$FSD/out.txt" "$T/reference.txt"
          sha256sum "$FSD/out.txt" "$T/reference.txt"
          if cmp "$FSD/out.txt" "$T/reference.txt"; then echo "reference.txt reproduced byte for byte"; else diff "$FSD/out.txt" "$T/reference.txt" | head -n 40; exit 1; fi
          "$FSD/fsref_dls" "$T/cases.txt" "$T" | cmp - "$T/reference.txt" && echo "(also with the DLS loader linked in)"
      - name: Download VintageDreamsWaves-v2.dls (pinned; never committed)
        run: |
          mkdir -p "$RUNNER_TEMP/vintage"
          curl -fsSL -o "$RUNNER_TEMP/vintage/VintageDreamsWaves-v2.dls" "$VINTAGE_URL"
          echo "$VINTAGE_SHA256  $RUNNER_TEMP/vintage/VintageDreamsWaves-v2.dls" | sha256sum -c -
      - name: Probes (a)-(i)
        run: |
          FSD="$RUNNER_TEMP/fsd"; T="$GITHUB_WORKSPACE/sdl3-mixer-fluidsynth/testdata"
          "$FSD/gendls.sh" "$FSD/dlsp"
          sha256sum "$FSD"/dlsp/*.dls
          FS_SRC="$RUNNER_TEMP/sdlorg-fluidsynth" "$FSD/probes.sh" "$FSD" "$T" "$RUNNER_TEMP/vintage/VintageDreamsWaves-v2.dls" 2>&1 | tee "$RUNNER_TEMP/probes.txt"
          grep -q "^=== done" "$RUNNER_TEMP/probes.txt"
      - name: Probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluidsynth-dls-probes
          path: |
            ${{ runner.temp }}/probes.txt
            ${{ runner.temp }}/fsd/out.txt
          if-no-files-found: ignore
