name: diag-cutout
# Throwaway: the emulator's display cutout over several boots (some boots
# have none: the window's safe area starts at the 63 px status bar).
on:
  push:
    branches: ["claude/diag-android-cutout"]
permissions:
  contents: read
jobs:
  boot:
    name: boot ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_EMULATOR_BUILD: "16428233"
      ANDROID_EMULATOR_SHA256: b08fc43d8608d2955f607f1b287beb525041e730086bdca3af152accac3af9c1
      ANDROID_IMAGE_ARCHIVE: x86_64-35_r09.zip
      ANDROID_IMAGE_SHA256: c67b9ba0ff5bc0eb6d046871bfa228af14d4d47b02f0cdae94f048e511b7566e
      SDL3_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator and its system image
        run: |
          D="$RUNNER_TEMP/android-download"
          mkdir -p "$D"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$D/emulator.zip" "https://dl.google.com/android/repository/emulator-linux_x64-$ANDROID_EMULATOR_BUILD.zip"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$D/image.zip" "https://dl.google.com/android/repository/sys-img/google_apis/$ANDROID_IMAGE_ARCHIVE"
          echo "$ANDROID_EMULATOR_SHA256  $D/emulator.zip" | sha256sum -c
          echo "$ANDROID_IMAGE_SHA256  $D/image.zip" | sha256sum -c
          rm -rf "$ANDROID_HOME/emulator"
          unzip -q "$D/emulator.zip" -d "$ANDROID_HOME"
          I="$ANDROID_HOME/$(echo "$SDL3_ANDROID_SYSTEM_IMAGE" | tr ';' /)"
          rm -rf "$I"; mkdir -p "$(dirname "$I")"
          unzip -q "$D/image.zip" -d "$(dirname "$I")"
          rm -rf "$D"
          sudo apt-get install -y -q libpulse0 > /dev/null || { sudo apt-get update -q > /dev/null && sudo apt-get install -y -q libpulse0 > /dev/null; }
      - name: Start the emulator
        run: echo "SDL3_ANDROID_SERIAL=$(tools/android_run.py --boot)" >> "$GITHUB_ENV"
      - name: Load the CPUs a while (as the build does)
        run: |
          for i in $(seq "$(nproc)"); do timeout 90 sh -c 'while :; do :; done' & done; wait || true
      - name: The state, at readiness and later
        shell: bash
        run: |
          A="$ANDROID_HOME/platform-tools/adb -s $SDL3_ANDROID_SERIAL"
          dump() {
            echo "===== $1 (uptime $($A shell cat /proc/uptime | cut -d' ' -f1))"
            $A shell 'cmd overlay lookup android android:string/config_mainBuiltInDisplayCutout 2>&1 | head -1 | cut -c1-80'
            $A shell 'dumpsys window displays 2>&1 | grep -oE "DisplayCutout\{insets=Rect\([^)]*\)[^}]{0,80}" | head -2'
            $A shell 'cmd overlay list android 2>&1 | grep -iE "cutout|\[x\]" | head -30'
            $A shell 'cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.HOME 2>&1 | tail -1'
            $A shell 'pm list packages -d 2>&1 | head; settings get global device_provisioned; settings get secure user_setup_complete'
            $A shell 'getprop | grep -iE "cutout|qemu.hw|hw.lcd|display|boot.qemu" | head -20'
          }
          python3 -I - "$SDL3_ANDROID_SERIAL" <<'PY'
          import sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), "tools"))
          import android_run as a
          s = sys.argv[1]
          print("readiness:", a.readiness(s))
          a.wait_until_ready(s)
          print("readiness after wait:", a.readiness(s))
          PY
          dump "after wait_until_ready"
          echo "===== forced: the overlay off, the ready mark gone, wait_until_ready again"
          $A shell 'cmd overlay disable --user 0 com.android.internal.emulation.pixel_6; rm -f /data/local/tmp/sdl3/ready-boot-id'
          sleep 3
          $A shell 'dumpsys window displays 2>&1 | grep -oE "DisplayCutout\{insets=Rect\([^)]*\)" | head -1'
          python3 -I - "$SDL3_ANDROID_SERIAL" <<'PY'
          import sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), "tools"))
          import android_run as a
          s = sys.argv[1]
          print("readiness (forced):", a.readiness(s))
          a.wait_until_ready(s)
          print("readiness after wait (forced):", a.readiness(s))
          PY
          dump "after the forced wait"
          echo "===== logcat"
          $A logcat -d 2>/dev/null | grep -iE "cutout|overlay|sdksetup|googlesdksetup|provision|DisplayCutout" | grep -v "^--" | head -120 || true
