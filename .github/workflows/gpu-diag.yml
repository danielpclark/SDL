      - name: Install the GPU drivers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          C="$RUNNER_TEMP/gpu-cache"
          G="$RUNNER_TEMP/gpu"
          mkdir -p "$C" "$G"
          cd "$C"
          if [ ! -f mesa.7z ]; then
