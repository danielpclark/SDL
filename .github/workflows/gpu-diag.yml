        run: |
          C="$RUNNER_TEMP/gpu-cache"
          mkdir -p "$C"
          cd "$C"
          if [ ! -f moltenvk.tar ]; then
            curl -fsSL -o moltenvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar"
