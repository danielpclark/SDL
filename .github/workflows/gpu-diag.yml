name: gpu-diag

on:
  push:
    branches: [claude/diag-gpu-ci]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  MESA_VERSION: "26.2.4"
  MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
  MOLTENVK_VERSION: "v1.4.2"
  MOLTENVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
  VULKAN_LOADER_TAG: "vulkan-sdk-1.4.363.0"
  VULKAN_LOADER_COMMIT: fa218055ff4948b159f31d43f800c808a13d51df

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag
      - name: Mesa
        shell: bash
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/mesa" && cd "$RUNNER_TEMP/mesa"
          curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -y mesa.7z x64 > /dev/null
          ls x64
      - name: Vulkan loader
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          git clone -q --depth 1 --branch "$VULKAN_LOADER_TAG" https://github.com/KhronosGroup/Vulkan-Loader
          cd Vulkan-Loader
          test "$(git rev-parse HEAD)" = "$VULKAN_LOADER_COMMIT"
          time cmake -S . -B build -D UPDATE_DEPS=ON -D CMAKE_BUILD_TYPE=Release > cmake.log 2>&1 || { tail -50 cmake.log; exit 1; }
          time cmake --build build --config Release --parallel > build.log 2>&1 || { tail -80 build.log; exit 1; }
      - name: Deploy
        shell: bash
        run: |
          set -x
          M="$RUNNER_TEMP/mesa/x64"
          L="$RUNNER_TEMP/Vulkan-Loader/build/loader/Release"
          for d in target/debug/deps target/release/deps; do
            mkdir -p $d
            cp "$M"/opengl32.dll "$M"/libgallium_wgl.dll "$M"/libEGL.dll "$M"/libGLESv2.dll "$L/vulkan-1.dll" $d/
          done
          # (the loader ignores VK_DRIVER_FILES in an elevated process, as the
          # runner's)
          MSYS_NO_PATHCONV=1 reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath -w "$M/lvp_icd.x86_64.json")" /t REG_DWORD /d 0 /f
          MSYS_NO_PATHCONV=1 reg query 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers'
      - name: cargo test, llvmpipe
        shell: bash
        continue-on-error: true
        env:
          GALLIUM_DRIVER: llvmpipe
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
          RUST_TEST_NOCAPTURE: 1
        run: |
          cargo test -p sdl3 --lib wgl_context -- --nocapture 2>&1 | grep -E "GL_|test |panicked" | cut -c1-300 || true
          time cargo test -p sdl3 --lib > "$RUNNER_TEMP/test.log" 2>&1 || true
          echo "=== tail"
          tail -25 "$RUNNER_TEMP/test.log" | cut -c1-300
      - name: GL under cdb
        if: false
        shell: bash
        continue-on-error: true
        run: |
          ls "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/" | head -5 || true
          cargo test -p sdl3 --lib wgl_context -- --nocapture 2>&1 | grep -E "GL_|test |panicked" | cut -c1-300
          EXE=$(ls -t target/debug/deps/sdl3-*.exe | head -1)
          echo "EXE=$EXE"
          cd "$RUNNER_TEMP/mesa"
          curl -fsSL -o dbg.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-debug-info-msvc.7z"
          7z x -y dbg.7z > /dev/null; ls; find . -name 'libgallium_wgl.pdb' -o -name 'opengl32.pdb' | head
          cd -
          PDBS=$(find "$RUNNER_TEMP/mesa" -name libgallium_wgl.pdb -printf '%h;' 2>/dev/null)
          CDB="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          "$CDB" -g -lines -y "$(cygpath -w "$RUNNER_TEMP/mesa/x64");$PDBS;$(cygpath -w target/debug/deps)" -c ".symopt+0x40; kn 60; ~*kn 8; q" "$EXE" render::opengl::tests::debug_context_reports_errors --nocapture --test-threads=1 > "$RUNNER_TEMP/cdb.log" 2>&1 || true
          grep -v "^ModLoad\|^\*\*\*\|Symbol search" "$RUNNER_TEMP/cdb.log" | tail -150 | cut -c1-300
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "=== failures"
          sed -n '/^failures:$/,$p' "$RUNNER_TEMP/test.log" | grep -v "^    " | tail -40 || true
          grep -A6 "panicked at" "$RUNNER_TEMP/test.log" | grep -v "^ *[0-9]*: \|^ *at " | head -150 | cut -c1-400 || true
          echo "=== skip counts"
          cut -f1 "$RUNNER_TEMP/skips.tsv" | sort | uniq -c || true
          echo "=== skips"
          sort -u "$RUNNER_TEMP/skips.tsv" | cut -c1-300 || true
          grep -E "^test result|GL_VERSION|GL_RENDERER" "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/test1.log" | cut -c1-300 || true

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag
      - name: MoltenVK
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/mvk" && cd "$RUNNER_TEMP/mvk"
          curl -fsSL -o mvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar"
          echo "$MOLTENVK_SHA256  mvk.tar" | shasum -a 256 -c
          tar xf mvk.tar
          D=$(dirname "$(find . -path '*dynamic*macOS*' -name libMoltenVK.dylib | head -1)")
          ls -la "$D"
          sudo mkdir -p /usr/local/lib
          sudo cp "$D/libMoltenVK.dylib" /usr/local/lib/
      - name: cargo test gpu_render_states (alone, module, render)
        continue-on-error: true
        env:
          MVK_CONFIG_LOG_LEVEL: "4"
          SDL_LOGGING: "gpu=verbose,render=verbose"
        run: |
          cargo test -p sdl3 --lib render::gpu::tests::gpu_render_states -- --nocapture > "$RUNNER_TEMP/one.log" 2>&1 || true
          grep -v "^\s*Compiling" "$RUNNER_TEMP/one.log" | grep -v "^ *[0-9]*: \|^ *at " | tail -10 | cut -c1-400
          T=render::gpu::tests::gpu_render_states
          echo "=== MTL_DEBUG_LAYER=1 alone"
          MTL_DEBUG_LAYER=1 MVK_CONFIG_LOG_LEVEL=2 cargo test -q -p sdl3 --lib $T -- --nocapture > "$RUNNER_TEMP/dbg.log" 2>&1 || true
          grep -v "^ *[0-9]*: \|^ *at \|^\s*Compiling" "$RUNNER_TEMP/dbg.log" | tail -60 | cut -c1-300
          echo "=== MTL_DEBUG_LAYER=1 all render::gpu"
          MTL_DEBUG_LAYER=1 cargo test -q -p sdl3 --lib render::gpu:: -- --test-threads=1 2>&1 | grep -E "test result|^without|panicked|mvk-err|failed assertion" | cut -c1-300
      - name: cargo test
        continue-on-error: true
        env:
          SDL3_TEST_SKIP_LOG: ${{ runner.temp }}/skips.tsv
          RUST_TEST_NOCAPTURE: 1
        run: |
          time cargo test -p sdl3 --lib > "$RUNNER_TEMP/test.log" 2>&1 || true
          time cargo test -p sdl3 --test cocoa --test cocoa_metal > "$RUNNER_TEMP/test2.log" 2>&1 || true
          grep -E "cocoa:|panicked|skipping" "$RUNNER_TEMP/test2.log" | tail -40
      - name: Summary
        if: always()
        run: |
          echo "=== failures"
          sed -n '/^failures:$/,$p' "$RUNNER_TEMP/test.log" | grep -v "^    " | tail -40 || true
          grep -A6 "panicked at" "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/test2.log" | grep -v "^ *[0-9]*: \|^ *at " | head -150 | cut -c1-400 || true
          echo "=== skip counts"
          cut -f1 "$RUNNER_TEMP/skips.tsv" | sort | uniq -c || true
          echo "=== skips"
          sort -u "$RUNNER_TEMP/skips.tsv" | cut -c1-300 || true
          grep -E "^test result" "$RUNNER_TEMP/test.log" || true
