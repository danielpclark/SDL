[package]
name = "sdl3-image"
description = "A direct, pure-Rust translation of SDL_image 3, the image file loading library for SDL3. No C code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["sdl", "sdl3", "image", "png", "pure-rust"]
categories = ["multimedia::images", "game-development"]

[lib]
name = "sdl3_image"
path = "src/lib.rs"

# The decoders are self-contained, as upstream's are when it is built with
# its bundled codecs: PNG and JPEG through the stb_image and miniz
# translations in `sdl3`, everything else translated here. No system image
# library is linked or loaded.
[dependencies]
sdl3 = { path = "../sdl3", version = "3.5.0" }

# On Emscripten, the images the browser decoded when their files were
# preloaded (IMG.c's emscripten_get_preloaded_image_data() calls), through
# sdl3's own Emscripten layer.
[target.'cfg(target_os = "emscripten")'.dependencies]
sdl3-emscripten = { path = "../sdl3-emscripten", version = "3.5.0" }

# The preloaded images on Emscripten (IMG_Load() and IMG_LoadTyped_IO()):
# stand-in canvases under node and in the browser, and the browser's own
# decoding through emscripten's image plugin, against upstream's C trace: a
# program that asks tools/emscripten_run.py for the browser.
[[test]]
name = "emscripten_preload"
harness = false
