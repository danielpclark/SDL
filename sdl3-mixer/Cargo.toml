[package]
name = "sdl3-mixer"
description = "A direct, pure-Rust translation of SDL_mixer 3, the audio mixer library for SDL3. No C code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# SDL_mixer's zlib license, the BSD licenses of libopus, opusfile and
# libogg for the translations of them in src/opus/, src/opusfile/ and
# src/ogg/, libvorbis's BSD license for the translation of it and of
# libvorbisfile in src/vorbis/, libFLAC's BSD license for the translation
# of it in src/flac/, WavPack's BSD license for the translation of it in src/wavpack/,
# and libxmp's MIT license for the translation of it in src/xmp/ (see
# LICENSE.txt).
license = "Zlib AND BSD-3-Clause AND MIT"
repository.workspace = true
readme = "../README.md"
keywords = ["sdl", "sdl3", "audio", "mixer", "pure-rust"]
categories = ["multimedia::audio", "game-development"]

[lib]
name = "sdl3_mixer"
path = "src/lib.rs"

# The decoders are self-contained, as upstream's are when it is built with
# its bundled codecs: dr_mp3, dr_flac and stb_vorbis are translated here,
# as are the libraries SDL_mixer vendors (libvorbis, libFLAC, libopus...,
# and TiMidity, FluidSynth, libmpg123 and Game_Music_Emu in crates of their
# own), with SDL_mixer's own WAV, AIFF, VOC and AU decoders. No system audio
# library is linked or loaded.
[dependencies]
sdl3 = { path = "../sdl3", version = "3.5.0" }
# MIDI through the bundled TiMidity, which upstream builds by default.
# NOTE: TiMidity is not zlib-licensed: sdl3-mixer-timidity is under
# "Artistic-1.0-Perl OR LGPL-2.1-only". Build with
# `default-features = false` for an sdl3-mixer under the zlib license (and
# the BSD licenses of the Vorbis, FLAC, Opus and WavPack decoders' libraries, and
# libxmp's MIT license) only.
sdl3-mixer-timidity = { path = "../sdl3-mixer-timidity", version = "3.5.0", optional = true }
# MP3 (and MPEG audio layers I and II) through the vendored libmpg123,
# which upstream builds by default. NOTE: libmpg123 is not zlib-licensed:
# sdl3-mixer-mpg123 is under "LGPL-2.1-only". Without it (with
# `default-features = false`), MP3 goes to the bundled dr_mp3.
sdl3-mixer-mpg123 = { path = "../sdl3-mixer-mpg123", version = "3.5.0", optional = true }
# MIDI through the FluidSynth SoundFont synthesizer, which upstream builds
# against the copy it vendors by default (and tries before TiMidity).
# NOTE: FluidSynth is not zlib-licensed: sdl3-mixer-fluidsynth is under
# "LGPL-2.1-or-later AND Apache-2.0" (effectively LGPL-3.0-or-later terms;
# see its NOTICE). Build with `default-features = false` for an sdl3-mixer
# under the zlib license (and the BSD licenses of the Vorbis, FLAC, Opus
# and WavPack decoders' libraries, and libxmp's MIT license) only.
sdl3-mixer-fluidsynth = { path = "../sdl3-mixer-fluidsynth", version = "3.5.0", optional = true }

# Game music (NSF and NSFE so far) through the vendored Game_Music_Emu, which
# upstream builds by default. NOTE: Game_Music_Emu is not zlib-licensed:
# sdl3-mixer-gme is under "LGPL-2.1-or-later AND MIT". Without it (with
# `default-features = false`), there is no game music decoder.
sdl3-mixer-gme = { path = "../sdl3-mixer-gme", version = "3.5.0", optional = true }

[features]
default = ["fluidsynth", "timidity", "mpg123", "gme"]
# The FLUIDSYNTH decoder (upstream's SDLMIXER_MIDI_FLUIDSYNTH, on by
# default): MIDI files played with a SoundFont the app gives (the
# "SDL_mixer.decoder.fluidsynth.soundfont_iostream" or
# "SDL_mixer.decoder.fluidsynth.soundfont_path" property) or, on Unix
# systems but Apple's, one at /usr/share/sounds/sf2/default-GM.sf2 and the
# like. Without one, it still plays MIDI files, silently, as upstream's.
fluidsynth = ["dep:sdl3-mixer-fluidsynth"]
# The TIMIDITY decoder (upstream's SDLMIXER_MIDI_TIMIDITY, on by default):
# MIDI files played with GUS patches or a SoundFont, as the TiMidity
# configuration file (TIMIDITY_CFG, /etc/timidity.cfg...) or the
# TIMIDITY_SOUNDFONT environment variable says.
timidity = ["dep:sdl3-mixer-timidity"]
# The MPG123 decoder (upstream's SDLMIXER_MP3_MPG123, on by default): MPEG
# audio layers I, II and III, tried before dr_mp3 (DRMP3, which then only
# gets the files libmpg123 refuses).
mpg123 = ["dep:sdl3-mixer-mpg123"]
# The GME decoder (upstream's SDLMIXER_GME, on by default): the music of
# classic consoles and computers from rips of their sound programs.
gme = ["dep:sdl3-mixer-gme"]
