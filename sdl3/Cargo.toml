[package]
name = "sdl3"
description = "A direct, pure-Rust translation of Simple DirectMedia Layer (SDL3). No C code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["sdl", "sdl3", "multimedia", "gamedev", "pure-rust"]
categories = ["multimedia", "game-development", "api-bindings"]

[lib]
name = "sdl3"
path = "src/lib.rs"

[features]
default = ["std"]
# The core is written so that it can eventually build on `no_std + alloc`
# targets; for now `std` is required.
std = []
# Override SDL_ASSERT_LEVEL for the sdl_assert* macros (default: 2 in debug
# builds of the calling crate, 1 in release builds). See `sdl3::assert`.
assert-level-0 = []
assert-level-1 = []
assert-level-2 = []
assert-level-3 = []
# Emscripten: SDL_RunApp() mounts IndexedDB storage (IDBFS, persisted
# automatically) at the path the SDL_EMSCRIPTEN_PERSISTENT_PATH environment
# variable names when this crate is built (as upstream's CMake option of
# that name does) and runs the main function once it's loaded. It links
# emscripten's IDBFS library (-lidbfs.js) itself. Nothing on other targets.
emscripten-persistent-path = ["sdl3-emscripten/idbfs"]

[dependencies]
# The platform-independent core uses no third-party crates. The platform
# layer reaches the OS through the pure-Rust declarations of `libc` and
# `windows-sys` (no C is compiled); everything else SDL loads at run time
# (X11, Wayland, ALSA, PulseAudio, ...) is declared by hand and dlopen'd,
# as upstream does.

[target.'cfg(unix)'.dependencies]
libc = "0.2.170"

# The JavaScript of the Emscripten build (em_js!, em_asm!, html5.h) lives
# in an internal crate: see its documentation.
[target.'cfg(target_os = "emscripten")'.dependencies]
sdl3-emscripten = { path = "../sdl3-emscripten", version = "3.5.0" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Sensors",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_ColorSystem",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# The Cocoa video driver, which only starts on the main thread: a program of
# its own without the test harness's threads.
[[test]]
name = "cocoa"
harness = false

# The macOS tray, file dialogs and notifications, which AppKit wants on the
# main thread too.
[[test]]
name = "cocoa_shell"
harness = false

# The Metal renderer and the GPU API on Cocoa windows (main thread too).
[[test]]
name = "cocoa_metal"
harness = false

# Emscripten's main callbacks, timers and SDL_RunApp(), which the browser's
# event loop runs after `main` returns, and which end the program: a
# program of its own, run under node.
[[test]]
name = "emscripten_main"
harness = false

# The Emscripten paths that need a browser (Battery Status API,
# window.open(), devicemotion events, WebGL and Web Audio probes): a program
# that asks tools/emscripten_run.py for headless Chromium.
[[test]]
name = "emscripten_browser"
harness = false

# The Emscripten canvas video driver (canvas windows, the framebuffer,
# cursors, fullscreen, pointer lock, the system theme) in headless Chromium:
# a program that asks tools/emscripten_run.py for the browser.
[[test]]
name = "emscripten_video"
harness = false

# The Emscripten event handling (keys, pointers, the wheel, focus,
# visibility, beforeunload, orientation, drag and drop, trusted input) in
# headless Chromium, against upstream's C trace: a program that asks
# tools/emscripten_run.py for the browser.
[[test]]
name = "emscripten_events"
harness = false

# The Emscripten video driver's WebGL contexts and the OpenGL ES 2 renderer
# on them (vertex buffer objects) in headless Chromium, against upstream's
# C trace: a program that asks tools/emscripten_run.py for the browser.
[[test]]
name = "emscripten_gl"
harness = false

# The Emscripten audio driver (Web Audio playback and recording, autoplay,
# the dummy driver's timers) in headless Chromium, against upstream's C
# trace: a program that asks tools/emscripten_run.py for the browser.
[[test]]
name = "emscripten_audio"
harness = false

# The Emscripten joystick driver (the Gamepad API: connecting and
# disconnecting, the standard and unmapped layouts, gamepads with the
# default mapping, rumble) on a stand-in Gamepad API in headless Chromium,
# against upstream's C trace: a program that asks tools/emscripten_run.py
# for the browser.
[[test]]
name = "emscripten_joystick"
harness = false

# The Emscripten camera driver (getUserMedia(): permission, the stream's
# format, frames through a canvas, pacing and timestamps, closing and
# quitting) on stand-in media devices and the browser's fake camera in
# headless Chromium, against upstream's C trace: a program that asks
# tools/emscripten_run.py for the browser.
[[test]]
name = "emscripten_camera"
harness = false

# What SDL does differently when the program is linked with Asyncify (its
# sleeps: delays, waits, the <dialog> message boxes, the framebuffer and
# buffer swaps, the main callbacks), against upstream's C trace: a program
# that asks tools/emscripten_link.py for -sASYNCIFY=1 and
# tools/emscripten_run.py for the browser.
[[test]]
name = "emscripten_asyncify"
harness = false

# The same program linked with JSPI (-sJSPI), in the browser only.
[[test]]
name = "emscripten_jspi"
harness = false

# SDL_RunApp()'s persistent storage (IDBFS); built with the path in
# SDL_EMSCRIPTEN_PERSISTENT_PATH (see the file).
[[test]]
name = "emscripten_persistent_path"
harness = false
required-features = ["emscripten-persistent-path"]

# The iOS Simulator runner's app mode (tools/ios_run.py): a program that
# runs as an app, in a bundle, and gives its exit status as the UIKit
# programs will.
[[test]]
name = "ios_runner"
harness = false

[[test]]
name = "uikit_main"
harness = false

[[test]]
name = "uikit_callbacks"
harness = false

[[test]]
name = "uikit_displays"
harness = false

[[test]]
name = "uikit_windows"
harness = false

[[test]]
name = "uikit_input"
harness = false

[[test]]
name = "uikit_keyboard"
harness = false

[[test]]
