[package]
name = "sdl3"
description = "A direct, pure-Rust translation of Simple DirectMedia Layer (SDL3). No C code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["sdl", "sdl3", "multimedia", "gamedev", "pure-rust"]
categories = ["multimedia", "game-development", "api-bindings"]

[lib]
name = "sdl3"
path = "src/lib.rs"

[features]
default = ["std"]
# The core is written so that it can eventually build on `no_std + alloc`
# targets; for now `std` is required.
std = []
# Override SDL_ASSERT_LEVEL for the sdl_assert* macros (default: 2 in debug
# builds of the calling crate, 1 in release builds). See `sdl3::assert`.
assert-level-0 = []
assert-level-1 = []
assert-level-2 = []
assert-level-3 = []

[dependencies]
# The platform-independent core uses no third-party crates. The platform
# layer reaches the OS through the pure-Rust declarations of `libc` and
# `windows-sys` (no C is compiled); everything else SDL loads at run time
# (X11, Wayland, ALSA, PulseAudio, ...) is declared by hand and dlopen'd,
# as upstream does.

[target.'cfg(unix)'.dependencies]
libc = "0.2.170"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
